<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Material — Status Produksi</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Segoe UI, Roboto, sans-serif; }
    body { background:#f5f7fa; padding:20px; max-width:1400px; margin:0 auto; }
    
    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
    .updated { color:#666; font-size:13px; }
    
    h1 { text-align:center; color:#1e3a8a; margin-bottom:15px; }
    
    .search-bar { background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:15px; }
    .search-bar input { width:40%; min-width:220px; }
    .search-bar select { margin:5px; min-width:180px; height:38px; }
    .hint { font-size:12px; color:#888; margin-top:5px; }
    
    .action-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
    .view-buttons { display:flex; gap:8px; }
    .btn-export { background:#10b981; color:white; border:none; padding:8px 20px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; }
    .btn-export:hover { background:#059669; }
    
    input, select { padding:10px 14px; border:1px solid #ddd; border-radius:8px; font-size:15px; }
    button { padding:8px 16px; border:none; border-radius:8px; cursor:pointer; font-size:14px; }
    button.active { background:#1e3a8a; color:white; }
    
    .table-container { overflow-x:auto; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); max-height:70vh; }
    table { width:100%; border-collapse:separate; border-spacing:0; background:white; }
    th { 
      background:#1e3a8a; color:white; padding:14px 12px; text-align:left; font-weight:600;
      position:sticky; top:0; z-index:10;
    }
    td { padding:12px; border-bottom:1px solid #eee; background:white; }
    tr:last-child td { border-bottom:none; }
    .status-disc { background:#fee2e2; color:#991b1b; font-weight:600; }
    .status-cont { background:#dbeafe; color:#1e40af; font-weight:600; }
    .status-other { background:#fef3c7; color:#92400e; font-weight:600; }
    
    .card-mode { display:none; gap:15px; flex-wrap:wrap; margin-top:15px; }
    .card { background:white; border-radius:12px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.08); width:calc(33% - 10px); min-width:280px; }
    .card.disc { border-left:5px solid #ef4444; }
    .card.cont { border-left:5px solid #3b82f6; }
    .card h3 { font-size:14px; color:#666; margin-bottom:8px; }
    .card h4 { font-size:16px; margin-bottom:10px; word-break:break-all; }
    .card .tag { display:inline-block; padding:4px 10px; border-radius:20px; font-size:13px; margin-bottom:8px; }
    .tag.disc { background:#fee2e2; color:#991b1b; }
    .tag.cont { background:#dbeafe; color:#1e40af; }
    
    @media(max-width:768px){ 
      .card { width:100%; }
      .search-bar input { width:100%; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <p class="updated">Terakhir diperbarui: <span id="lastUpdate">—</span></p>
    <div></div>
  </div>

  <h1>📦 Daftar Material — Status Produksi</h1>

  <div class="search-bar">
    <input type="text" id="search" placeholder="🔍 Cari kode, nama, atau pemasok...">
    <select id="filterSupplier" multiple>
      <option value="">Semua Pemasok</option>
    </select>
    <select id="filterOrigin" multiple>
      <option value="">Semua Asal</option>
    </select>
    <select id="filterStatus" multiple>
      <option value="">Semua Status</option>
      <option value="continue">Lanjut Produksi</option>
      <option value="discontinue">Dihentikan</option>
    </select>
    <p class="hint">💡 Tahan <strong>Ctrl</strong> lalu klik untuk pilih lebih dari satu</p>
  </div>

  <div class="action-bar">
    <div class="view-buttons">
      <button id="btnTable" class="active">📋 Tampilan Tabel</button>
      <button id="btnCard">🃏 Tampilan Kartu</button>
    </div>
    <button class="btn-export" onclick="exportToExcel()">📊 Ekspor ke Excel</button>
  </div>

  <div id="tableView" class="table-container">
    <table id="dataTable">
      <thead>
        <tr>
          <th>Kode Material</th>
          <th>Nama Barang</th>
          <th>Pemasok</th>
          <th>Asal</th>
          <th>Status</th>
          <th>Catatan</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div id="cardView" class="card-mode"></div>

  <script>
    let allData = [];
    let suppliers = new Set();
    let origins = new Set();

    async function loadData(){
      try {
        const res = await fetch('data.csv');
        const text = await res.text();
        parseCSV(text);
      } catch(e){
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" style="color:red;text-align:center">Gagal memuat data. Pastikan file data.csv sudah diunggah.</td></tr>`;
      }
    }

    // PERBAIKAN: Baca CSV dengan benar agar teks Mandarin tidak hilang
    function parseCSV(text){
      // Hapus BOM jika ada
      text = text.replace(/^\uFEFF/, '');
      
      // Pisah baris dengan benar
      const lines = text.trim().split('\n');
      if(lines.length < 2) return;
      
      // Ambil nama kolom
      const headers = parseCSVLine(lines[0]);
      
      allData = []; 
      suppliers.clear(); 
      origins.clear();

      // Baca setiap baris data
      for(let i = 1; i < lines.length; i++){
        if(!lines[i].trim()) continue; // lewati baris kosong
        const row = parseCSVLine(lines[i]);
        
        const rec = {
          code: (row[0] || '').trim(),
          name: (row[1] || '').trim(),
          supplier: (row[2] || '').trim(),
          origin: (row[3] || '').trim(),
          status: (row[4] || '').trim(),
          note: (row[5] || '').trim()
        };
        
        allData.push(rec);
        if(rec.supplier) suppliers.add(rec.supplier);
        if(rec.origin) origins.add(rec.origin);
      }

      // Isi filter Pemasok
      const selSup = document.getElementById('filterSupplier');
      selSup.innerHTML = '';
      [...suppliers].sort().forEach(s=> {
        selSup.innerHTML += `<option value="${s}">${s}</option>`;
      });

      // Isi filter Asal
      const selOrigin = document.getElementById('filterOrigin');
      selOrigin.innerHTML = '';
      [...origins].sort().forEach(o=> {
        selOrigin.innerHTML += `<option value="${o}">${o}</option>`;
      });

      document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
      render();
    }

    // Fungsi baca 1 baris CSV — memahami tanda kutip agar teks lengkap
    function parseCSVLine(line){
      const result = [];
      let current = '';
      let inQuotes = false;
      
      for(let i = 0; i < line.length; i++){
        const c = line[i];
        if(c === '"'){
          if(inQuotes && line[i+1] === '"'){
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if(c === ',' && !inQuotes){
          result.push(current.trim());
          current = '';
        } else {
          current += c;
        }
      }
      result.push(current.trim());
      return result;
    }

    function getStatusClass(status){
      const s = status.toLowerCase();
      if(s.includes('discontinue') || s.includes('dihentikan') || s.includes('停产')) return 'disc';
      if(s.includes('continue') || s.includes('lanjut') || s.includes('继续')) return 'cont';
      return 'other';
    }

    // Ambil nilai yang dipilih dari filter multiple
    function getSelectedValues(selectId){
      const sel = document.getElementById(selectId);
      return Array.from(sel.options)
        .filter(opt => opt.selected && opt.value !== '')
        .map(opt => opt.value);
    }

    function render(){
      const q = document.getElementById('search').value.toLowerCase();
      const selectedSups = getSelectedValues('filterSupplier');
      const selectedOrigins = getSelectedValues('filterOrigin');
      const selectedStatus = getSelectedValues('filterStatus');

      let filtered = allData.filter(d=>{
        const matchQ = !q || [d.code,d.name,d.supplier,d.origin,d.status,d.note]
          .some(x => x.toLowerCase().includes(q));
        
        // Jika ada pilihan, harus cocok dengan salah satunya
        const matchSup = selectedSups.length === 0 || selectedSups.includes(d.supplier);
        const matchOrg = selectedOrigins.length === 0 || selectedOrigins.includes(d.origin);
        
        let matchSt = selectedStatus.length === 0;
        if(!matchSt){
          const stLower = d.status.toLowerCase();
          if(selectedStatus.includes('continue') && 
             (stLower.includes('continue') || stLower.includes('lanjut') || stLower.includes('继续'))) matchSt = true;
          if(selectedStatus.includes('discontinue') && 
             (stLower.includes('discontinue') || stLower.includes('dihentikan') || stLower.includes('停产'))) matchSt = true;
        }
        
        return matchQ && matchSup && matchOrg && matchSt;
      });

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = filtered.map(d=>{
        const cls = getStatusClass(d.status);
        return `<tr>
          <td><strong>${d.code}</strong></td>
          <td>${d.name}</td>
          <td>${d.supplier}</td>
          <td>${d.origin}</td>
          <td class="status-${cls}">${d.status}</td>
          <td>${d.note}</td>
        </tr>`;
      }).join('');

      const cardDiv = document.getElementById('cardView');
      cardDiv.innerHTML = filtered.map(d=>{
        const cls = getStatusClass(d.status);
        return `<div class="card ${cls}">
          <h3>${d.code}</h3>
          <h4>${d.name}</h4>
          <span class="tag ${cls}">${d.status}</span>
          <p><strong>Pemasok:</strong> ${d.supplier}</p>
          <p><strong>Asal:</strong> ${d.origin}</p>
          <p style="margin-top:8px; font-size:13px; color:#555;">${d.note || '-'}</p>
        </div>`;
      }).join('');
    }

    function exportToExcel(){
      const q = document.getElementById('search').value.toLowerCase();
      const selectedSups = getSelectedValues('filterSupplier');
      const selectedOrigins = getSelectedValues('filterOrigin');
      const selectedStatus = getSelectedValues('filterStatus');

      let filtered = allData.filter(d=>{
        const matchQ = !q || [d.code,d.name,d.supplier,d.origin,d.status,d.note]
          .some(x => x.toLowerCase().includes(q));
        const matchSup = selectedSups.length === 0 || selectedSups.includes(d.supplier);
        const matchOrg = selectedOrigins.length === 0 || selectedOrigins.includes(d.origin);
        
        let matchSt = selectedStatus.length === 0;
        if(!matchSt){
          const stLower = d.status.toLowerCase();
          if(selectedStatus.includes('continue') && 
             (stLower.includes('continue') || stLower.includes('lanjut') || stLower.includes('继续'))) matchSt = true;
          if(selectedStatus.includes('discontinue') && 
             (stLower.includes('discontinue') || stLower.includes('dihentikan') || stLower.includes('停产'))) matchSt = true;
        }
        return matchQ && matchSup && matchOrg && matchSt;
      });

      // Pakai titik koma = langsung terbaca Excel Indonesia
      const escape = (val) => `"${String(val||'').replace(/"/g,'""')}"`;
      const sep = ';';

      let csv = "\uFEFF"; // BOM = huruf Mandarin tampil benar
      csv += ["Kode Material","Nama Barang","Pemasok","Asal","Status","Catatan"].map(escape).join(sep) + "\n";
      
      filtered.forEach(d=>{
        csv += [
          escape(d.code),
          escape(d.name),
          escape(d.supplier),
          escape(d.origin),
          escape(d.status),
          escape(d.note)
        ].join(sep) + "\n";
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "Daftar_Material_" + new Date().toLocaleDateString('id-ID').replace(/\//g,'-') + ".csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    document.getElementById('btnTable').onclick = ()=>{
      document.getElementById('tableView').style.display='block';
      document.getElementById('cardView').style.display='none';
      document.getElementById('btnTable').classList.add('active');
      document.getElementById('btnCard').classList.remove('active');
    };
    document.getElementById('btnCard').onclick = ()=>{
      document.getElementById('tableView').style.display='none';
      document.getElementById('cardView').style.display='flex';
      document.getElementById('btnCard').classList.add('active');
      document.getElementById('btnTable').classList.remove('active');
    };

    ['search','filterSupplier','filterOrigin','filterStatus'].forEach(id=>{
      document.getElementById(id).addEventListener('change', render);
      document.getElementById(id).addEventListener('input', render);
    });

    loadData();
  </script>
</body>
</html>
