<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advance Digitals — Product and status</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Segoe UI, Roboto, sans-serif; }
    body { background:#f5f7fa; padding:20px; max-width:1400px; margin:0 auto; }
    
    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
    .updated { color:#666; font-size:13px; }
    
    h1 { text-align:center; color:#1e3a8a; margin-bottom:15px; }
    
    .search-bar { background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:15px; }
    .search-top { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; margin-bottom:15px; }
    .search-input { flex:1; min-width:280px; }
    .search-input input { width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px; font-size:15px; }
    
    .filter-group { display:flex; gap:15px; flex-wrap:wrap; }
    .filter-box { min-width:240px; }
    .filter-label { font-weight:600; color:#333; margin-bottom:8px; display:block; font-size:14px; }
    .dropdown-toggle {
      width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;
      background:white; text-align:left; cursor:pointer; font-size:14px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .dropdown-toggle:hover { border-color:#1e3a8a; }
    .dropdown-menu {
      position:absolute; background:white; border:1px solid #ddd; border-radius:8px;
      box-shadow:0 4px 12px rgba(0,0,0,.15); max-height:280px; overflow-y:auto;
      z-index:100; min-width:240px; margin-top:4px;
      display:none;
    }
    .dropdown-menu.open { display:block; }
    .dropdown-item { padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:10px; }
    .dropdown-item:hover { background:#f0f4ff; }
    .dropdown-item input[type="checkbox"] { width:18px; height:18px; cursor:pointer; }
    .selected-count { font-size:13px; color:#666; margin-left:8px; }
    
    .action-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
    .view-buttons { display:flex; gap:8px; }
    .btn-export { background:#10b981; color:white; border:none; padding:10px 24px; border-radius:8px; font-size:15px; cursor:pointer; font-weight:600; }
    .btn-export:hover { background:#059669; }
    
    button { padding:10px 18px; border:none; border-radius:8px; cursor:pointer; font-size:14px; }
    button.active { background:#1e3a8a; color:white; }
    
    .table-container { overflow-x:auto; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); max-height:70vh; }
    table { width:100%; border-collapse:separate; border-spacing:0; background:white; }
    th { 
      background:#1e3a8a; color:white; padding:14px 12px; text-align:left; font-weight:600;
      position:sticky; top:0; z-index:10;
    }
    td { padding:12px; border-bottom:1px solid #eee; background:white; }
    tr:last-child td { border-bottom:none; }
    .status-disc { background:#fee2e2; color:#991b1b; font-weight:600; }
    .status-cont { background:#dbeafe; color:#1e40af; font-weight:600; }
    .status-other { background:#fef3c7; color:#92400e; font-weight:600; }
    
    .card-mode { display:none; gap:15px; flex-wrap:wrap; margin-top:15px; }
    .card { background:white; border-radius:12px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.08); width:calc(33% - 10px); min-width:280px; }
    .card.disc { border-left:5px solid #ef4444; }
    .card.cont { border-left:5px solid #3b82f6; }
    .card h3 { font-size:14px; color:#666; margin-bottom:8px; }
    .card h4 { font-size:16px; margin-bottom:10px; word-break:break-all; }
    .card .tag { display:inline-block; padding:4px 10px; border-radius:20px; font-size:13px; margin-bottom:8px; }
    .tag.disc { background:#fee2e2; color:#991b1b; }
    .tag.cont { background:#dbeafe; color:#1e40af; }
    
    @media(max-width:768px){ 
      .card { width:100%; }
      .filter-group { flex-direction:column; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <p class="updated">Terakhir diperbarui: <span id="lastUpdate">—</span></p>
    <div></div>
  </div>

  <h1>Advance Digitals — Product and status</h1>

  <div class="search-bar">
    <div class="search-top">
      <div class="search-input">
        <input type="text" id="search" placeholder="🔍 Cari kode, nama, atau tekan Enter untuk cari...">
      </div>
    </div>
    
    <div class="filter-group">
      <div class="filter-box">
        <label class="filter-label">Pemasok</label>
        <button class="dropdown-toggle" id="supplierToggle" type="button">
          <span id="supplierText">Semua Pemasok</span>
          <span>▼</span>
        </button>
        <div class="dropdown-menu" id="supplierMenu"></div>
      </div>
      
      <div class="filter-box">
        <label class="filter-label">Asal</label>
        <button class="dropdown-toggle" id="originToggle" type="button">
          <span id="originText">Semua Asal</span>
          <span>▼</span>
        </button>
        <div class="dropdown-menu" id="originMenu"></div>
      </div>
      
      <div class="filter-box">
        <label class="filter-label">Status</label>
        <button class="dropdown-toggle" id="statusToggle" type="button">
          <span id="statusText">Semua Status</span>
          <span>▼</span>
        </button>
        <div class="dropdown-menu" id="statusMenu">
          <label class="dropdown-item">
            <input type="checkbox" value="continue"> Lanjut Produksi
          </label>
          <label class="dropdown-item">
            <input type="checkbox" value="discontinue"> Dihentikan
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <div class="view-buttons">
      <button id="btnTable" class="active">📋 Tampilan Tabel</button>
      <button id="btnCard">🃏 Tampilan Kartu</button>
    </div>
    <button class="btn-export" onclick="exportToExcel()">📊 Ekspor ke Excel</button>
  </div>

  <div id="tableView" class="table-container">
    <table id="dataTable">
      <thead>
        <tr>
          <th>Kode Material</th>
          <th>Nama Barang</th>
          <th>Pemasok</th>
          <th>Asal</th>
          <th>Status</th>
          <th>Catatan</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div id="cardView" class="card-mode"></div>

  <script>
    let allData = [];
    let suppliers = [];
    let origins = [];
    
    const selected = {
      supplier: new Set(),
      origin: new Set(),
      status: new Set()
    };

    async function loadData(){
      try {
        const res = await fetch('data.csv');
        const text = await res.text();
        parseCSV(text);
      } catch(e){
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" style="color:red;text-align:center">Gagal memuat data. Pastikan file data.csv sudah diunggah.</td></tr>`;
      }
    }

    function parseCSV(text){
      text = text.replace(/^\uFEFF/, '');
      const lines = text.trim().split('\n');
      if(lines.length < 2) return;
      
      allData = [];
      const supplierSet = new Set();
      const originSet = new Set();

      for(let i = 1; i < lines.length; i++){
        if(!lines[i].trim()) continue;
        const row = parseCSVLine(lines[i]);
        const rec = {
          code: (row[0] || '').trim(),
          name: (row[1] || '').trim(),
          supplier: (row[2] || '').trim(),
          origin: (row[3] || '').trim(),
          status: (row[4] || '').trim(),
          note: (row[5] || '').trim()
        };
        allData.push(rec);
        if(rec.supplier) supplierSet.add(rec.supplier);
        if(rec.origin) originSet.add(rec.origin);
      }

      suppliers = [...supplierSet].sort();
      origins = [...originSet].sort();
      
      renderSupplierMenu();
      renderOriginMenu();
      
      document.getElementById('lastUpdate').textContent = 
        new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
      render();
    }

    function parseCSVLine(line){
      const result = [];
      let current = '';
      let inQuotes = false;
      for(let i = 0; i < line.length; i++){
        const c = line[i];
        if(c === '"'){
          if(inQuotes && line[i+1] === '"'){
            current += '"'; i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if(c === ',' && !inQuotes){
          result.push(current.trim());
          current = '';
        } else {
          current += c;
        }
      }
      result.push(current.trim());
      return result;
    }

    function renderSupplierMenu(){
      const menu = document.getElementById('supplierMenu');
      menu.innerHTML = suppliers.map(s => `
        <label class="dropdown-item">
          <input type="checkbox" class="supplier-check" value="${s}"> ${s}
        </label>
      `).join('');
      menu.querySelectorAll('.supplier-check').forEach(cb => {
        cb.addEventListener('change', () => {
          if(cb.checked) selected.supplier.add(cb.value);
          else selected.supplier.delete(cb.value);
          updateToggleText('supplier');
          render();
        });
      });
    }

    function renderOriginMenu(){
      const menu = document.getElementById('originMenu');
      menu.innerHTML = origins.map(o => `
        <label class="dropdown-item">
          <input type="checkbox" class="origin-check" value="${o}"> ${o}
        </label>
      `).join('');
      menu.querySelectorAll('.origin-check').forEach(cb => {
        cb.addEventListener('change', () => {
          if(cb.checked) selected.origin.add(cb.value);
          else selected.origin.delete(cb.value);
          updateToggleText('origin');
          render();
        });
      });
    }

    function updateToggleText(type){
      const set = selected[type];
      const textEl = document.getElementById(`${type}Text`);
      if(set.size === 0){
        const labels = {supplier:'Semua Pemasok', origin:'Semua Asal', status:'Semua Status'};
        textEl.textContent = labels[type];
      } else if(set.size === 1){
        textEl.textContent = [...set][0];
      } else {
        textEl.textContent = `${set.size} dipilih`;
      }
    }

    function getStatusClass(status){
      const s = status.toLowerCase();
      if(s.includes('discontinue') || s.includes('dihentikan') || s.includes('停产')) return 'disc';
      if(s.includes('continue') || s.includes('lanjut') || s.includes('继续')) return 'cont';
      return 'other';
    }

    function render(){
      const q = document.getElementById('search').value.toLowerCase();
      
      let filtered = allData.filter(d => {
        const matchQ = !q || [d.code,d.name,d.supplier,d.origin,d.status,d.note]
          .some(x => x.toLowerCase().includes(q));
        const matchSup = selected.supplier.size === 0 || selected.supplier.has(d.supplier);
        const matchOrg = selected.origin.size === 0 || selected.origin.has(d.origin);
        
        let matchSt = selected.status.size === 0;
        if(!matchSt){
          const stLower = d.status.toLowerCase();
          if(selected.status.has('continue') && 
             (stLower.includes('continue') || stLower.includes('lanjut') || stLower.includes('继续'))) matchSt = true;
          if(selected.status.has('discontinue') && 
             (stLower.includes('discontinue') || stLower.includes('dihentikan') || stLower.includes('停产'))) matchSt = true;
        }
        return matchQ && matchSup && matchOrg && matchSt;
      });

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = filtered.map(d => {
        const cls = getStatusClass(d.status);
        return `<tr>
          <td><strong>${d.code}</strong></td>
          <td>${d.name}</td>
          <td>${d.supplier}</td>
          <td>${d.origin}</td>
          <td class="status-${cls}">${d.status}</td>
          <td>${d.note}</td>
        </tr>`;
      }).join('');

      const cardDiv = document.getElementById('cardView');
      cardDiv.innerHTML = filtered.map(d => {
        const cls = getStatusClass(d.status);
        return `<div class="card ${cls}">
          <h3>${d.code}</h3>
          <h4>${d.name}</h4>
          <span class="tag ${cls}">${d.status}</span>
          <p><strong>Pemasok:</strong> ${d.supplier}</p>
          <p><strong>Asal:</strong> ${d.origin}</p>
          <p style="margin-top:8px; font-size:13px; color:#555;">${d.note || '-'}</p>
        </div>`;
      }).join('');
    }

    function exportToExcel(){
      const q = document.getElementById('search').value.toLowerCase();
      
      let filtered = allData.filter(d => {
        const matchQ = !q || [d.code,d.name,d.supplier,d.origin,d.status,d.note]
          .some(x => x.toLowerCase().includes(q));
        const matchSup = selected.supplier.size === 0 || selected.supplier.has(d.supplier);
        const matchOrg = selected.origin.size === 0 || selected.origin.has(d.origin);
        
        let matchSt = selected.status.size === 0;
        if(!matchSt){
          const stLower = d.status.toLowerCase();
          if(selected.status.has('continue') && 
             (stLower.includes('continue') || stLower.includes('lanjut') || stLower.includes('继续'))) matchSt = true;
          if(selected.status.has('discontinue') && 
             (stLower.includes('discontinue') || stLower.includes('dihentikan') || stLower.includes('停产'))) matchSt = true;
        }
        return matchQ && matchSup && matchOrg && matchSt;
      });

      const escape = (val) => `"${String(val||'').replace(/"/g,'""')}"`;
      const sep = ';';

      let csv = "\uFEFF";
      csv += ["Kode Material","Nama Barang","Pemasok","Asal","Status","Catatan"].map(escape).join(sep) + "\n";
      
      filtered.forEach(d => {
        csv += [escape(d.code), escape(d.name), escape(d.supplier), escape(d.origin), escape(d.status), escape(d.note)].join(sep) + "\n";
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "Daftar_Product advance_" + new Date().toLocaleDateString('id-ID').replace(/\//g,'-') + ".csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // Buka/tutup menu dropdown
    function setupToggle(toggleId, menuId){
      const toggle = document.getElementById(toggleId);
      const menu = document.getElementById(menuId);
      
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = menu.classList.contains('open');
        document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
        if(!isOpen) menu.classList.add('open');
      });
    }

    setupToggle('supplierToggle', 'supplierMenu');
    setupToggle('originToggle', 'originMenu');
    setupToggle('statusToggle', 'statusMenu');

    // Tutup menu jika klik di luar
    document.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
    });
    document.querySelectorAll('.dropdown-menu').forEach(m => {
      m.addEventListener('click', e => e.stopPropagation());
    });

    // Cari saat tekan Enter
    document.getElementById('search').addEventListener('keypress', (e) => {
      if(e.key === 'Enter') render();
    });

    // Status checkbox
    document.querySelectorAll('#statusMenu input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        if(cb.checked) selected.status.add(cb.value);
        else selected.status.delete(cb.value);
        updateToggleText('status');
        render();
      });
    });

    document.getElementById('btnTable').onclick = () => {
      document.getElementById('tableView').style.display = 'block';
      document.getElementById('cardView').style.display = 'none';
      document.getElementById('btnTable').classList.add('active');
      document.getElementById('btnCard').classList.remove('active');
    };
    document.getElementById('btnCard').onclick = () => {
      document.getElementById('tableView').style.display = 'none';
      document.getElementById('cardView').style.display = 'flex';
      document.getElementById('btnCard').classList.add('active');
      document.getElementById('btnTable').classList.remove('active');
    };

    loadData();
  </script>
</body>
</html>
