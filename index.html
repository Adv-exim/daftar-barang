<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advance Digitals — Product and Status</title>

  <style>
    :root {
      --primary: #0f8b93;
      --primary-dark: #0b7077;
      --primary-light: #27b9c1;
      --accent-gradient: linear-gradient(135deg, #12b7c5, #087f83);

      --bg: #f2f7f8;
      --bg-gradient: linear-gradient(135deg, #f7fbfc 0%, #edf4f6 100%);
      --card-bg: #ffffff;
      --card-bg-hover: #f7fbfc;
      --border: #dfe8eb;

      --text: #334155;
      --text-light: #64748b;
      --text-muted: #94a3b8;

      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 3px 9px rgba(15, 23, 42, 0.10);
      --shadow-lg: 0 12px 24px rgba(15, 23, 42, 0.14);
      --shadow-glow: 0 0 18px rgba(18, 183, 197, 0.17);

      --radius: 12px;
      --radius-sm: 8px;

      --status-disc-bg: #fff4f4;
      --status-disc-text: #a82929;
      --status-disc-border: #f3b4b4;

      --status-cont-bg: #ecfdf6;
      --status-cont-text: #08784f;
      --status-cont-border: #92dfbd;

      --status-other-bg: #fff9e7;
      --status-other-text: #95630e;
      --status-other-border: #f6d87c;

      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.55);
    }

    [data-theme="dark"] {
      --primary: #22c5cb;
      --primary-dark: #11979e;
      --primary-light: #5ee7e9;
      --accent-gradient: linear-gradient(135deg, #20c8d2, #149b9e);

      --bg: #111c2a;
      --bg-gradient: linear-gradient(135deg, #101b29 0%, #1b2a3b 100%);
      --card-bg: #1c2b3d;
      --card-bg-hover: #263a50;
      --border: #35495e;

      --text: #e6edf5;
      --text-light: #b2c0d0;
      --text-muted: #8ea0b5;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.30);
      --shadow-md: 0 4px 10px rgba(0, 0, 0, 0.34);
      --shadow-lg: 0 12px 26px rgba(0, 0, 0, 0.44);
      --shadow-glow: 0 0 18px rgba(34, 197, 203, 0.16);

      --status-disc-bg: rgba(239, 68, 68, 0.13);
      --status-disc-text: #fca5a5;
      --status-disc-border: rgba(252, 165, 165, 0.42);

      --status-cont-bg: rgba(16, 185, 129, 0.13);
      --status-cont-text: #86efac;
      --status-cont-border: rgba(134, 239, 172, 0.36);

      --status-other-bg: rgba(234, 179, 8, 0.13);
      --status-other-text: #fde68a;
      --status-other-border: rgba(253, 230, 138, 0.35);

      --glass-bg: rgba(28, 43, 61, 0.89);
      --glass-border: rgba(255, 255, 255, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      max-width: 1450px;
      margin: 0 auto;
      padding: 20px;
      background: var(--bg-gradient);
      color: var(--text);
      font-family: "Segoe UI", Inter, Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      transition: background 0.25s ease, color 0.25s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-title h1 {
      margin: 0 0 3px;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title p {
      margin: 0;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }

    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 14px;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-item {
      min-width: 70px;
      padding: 6px 12px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg-hover);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .stat-item:hover {
      border-color: var(--primary-light);
      box-shadow: var(--shadow-sm);
    }

    .stat-value {
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.15;
    }

    .stat-label {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    .theme-toggle {
      position: relative;
      width: 64px;
      height: 32px;
      padding: 0;
      border: 2px solid var(--border);
      border-radius: 999px;
      background: #dfe7ee;
      box-shadow: none;
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .theme-toggle:hover {
      border-color: var(--primary-light);
      box-shadow: var(--shadow-glow);
      transform: none;
    }

    .theme-toggle.active {
      border-color: transparent;
      background: var(--accent-gradient);
    }

    .theme-toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
      font-size: 14px;
      line-height: 1;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .theme-toggle.active .theme-toggle-slider {
      transform: translateX(32px);
    }

    .search-bar {
      position: relative;
      z-index: 20;
      overflow: visible;
      padding: 15px 18px;
      margin-bottom: 15px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .search-bar::before {
      position: absolute;
      top: -1px;
      right: -1px;
      left: -1px;
      height: 3px;
      content: "";
      border-radius: 12px 12px 0 0;
      background: var(--accent-gradient);
    }

    .search-top {
      display: flex;
      margin-bottom: 12px;
    }

    .search-input-wrapper {
      display: flex;
      flex: 1;
      gap: 10px;
      min-width: 0;
    }

    .search-input {
      position: relative;
      flex: 1;
      min-width: 180px;
    }

    .search-input input {
      width: 100%;
      height: 44px;
      padding: 10px 44px 10px 14px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      background: var(--card-bg-hover);
      font-size: 13px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .search-input input::placeholder {
      color: var(--text-muted);
    }

    .search-input input:focus {
      border-color: var(--primary-light);
      background: var(--card-bg);
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.13);
    }

    .search-icon-indicator {
      position: absolute;
      top: 50%;
      right: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 0.2s ease;
      font-size: 16px;
    }

    .search-icon-indicator.active {
      opacity: 1;
    }

    .btn-search,
    .btn-export {
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent-gradient);
      color: #ffffff !important;
      box-shadow: 0 2px 6px rgba(15, 118, 122, 0.25);
      font-size: 13px;
      font-weight: 650;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-search {
      height: 44px;
      padding: 0 20px;
      white-space: nowrap;
    }

    .btn-export {
      padding: 10px 20px;
      white-space: nowrap;
    }

    .btn-search:hover,
    .btn-export:hover {
      color: #ffffff !important;
      filter: brightness(1.04);
      box-shadow: 0 6px 14px rgba(15, 118, 122, 0.30);
      transform: translateY(-1px);
    }

    .btn-search:active,
    .btn-export:active {
      transform: translateY(0);
    }

    .filter-group {
      position: relative;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .filter-box {
      position: relative;
      flex: 1;
      min-width: 205px;
    }

    .filter-label {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 12px;
      font-weight: 650;
    }

    .dropdown-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 42px;
      padding: 9px 12px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg-hover);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .dropdown-toggle:hover,
    .dropdown-toggle.active {
      color: var(--text);
      border-color: var(--primary-light);
      background: var(--card-bg);
      box-shadow: var(--shadow-glow);
      transform: none;
    }

    .dropdown-arrow {
      flex: 0 0 auto;
      margin-left: 10px;
      color: var(--text-muted);
      font-size: 10px;
      transition: transform 0.2s ease;
    }

    .dropdown-toggle.active .dropdown-arrow {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      display: none;
      width: max-content;
      min-width: 100%;
      max-width: min(390px, calc(100vw - 48px));
      max-height: 300px;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 5px 0;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      box-shadow: var(--shadow-lg);
      z-index: 1000;
    }

    .dropdown-menu.open {
      display: block;
      animation: slideDown 0.16s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
      padding: 8px 14px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      line-height: 1.35;
      transition: background 0.15s ease;
    }

    .dropdown-item:hover {
      color: var(--text);
      background: var(--card-bg-hover);
    }

    .dropdown-item span {
      overflow-wrap: anywhere;
    }

    .dropdown-item input[type="checkbox"] {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .select-all-item {
      position: sticky;
      top: -5px;
      z-index: 2;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg-hover);
    }

    .select-all-item:hover {
      background: var(--card-bg-hover);
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 15px;
    }

    .view-buttons {
      display: flex;
      gap: 8px;
    }

    .view-buttons button {
      padding: 9px 16px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      font-size: 13px;
      font-weight: 650;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .view-buttons button:hover {
      color: var(--text);
      border-color: var(--primary-light);
      background: var(--card-bg-hover);
      box-shadow: var(--shadow-sm);
      transform: none;
    }

    .view-buttons button.active {
      color: #ffffff !important;
      border-color: transparent;
      background: var(--accent-gradient);
      box-shadow: 0 3px 8px rgba(15, 118, 122, 0.22);
    }

    .table-container {
      max-height: 72vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      box-shadow: var(--shadow-md);
    }

    table {
      width: 100%;
      min-width: 920px;
      border-spacing: 0;
      border-collapse: separate;
      background: var(--card-bg);
    }

    th {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 13px 14px;
      color: #ffffff;
      border-bottom: 2px solid rgba(255, 255, 255, 0.18);
      background: var(--accent-gradient);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 13px;
      vertical-align: middle;
      transition: background 0.16s ease;
    }

    tbody tr:hover td {
      background: var(--card-bg-hover);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .material-code {
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .status-disc {
      color: var(--status-disc-text);
      border-color: var(--status-disc-border);
      background: var(--status-disc-bg);
    }

    .status-cont {
      color: var(--status-cont-text);
      border-color: var(--status-cont-border);
      background: var(--status-cont-bg);
    }

    .status-other {
      color: var(--status-other-text);
      border-color: var(--status-other-border);
      background: var(--status-other-bg);
    }

    .empty-cell {
      padding: 0 !important;
    }

    .empty-state,
    .loading,
    .error-state {
      padding: 54px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-state strong,
    .error-state strong {
      color: var(--text);
    }

    .error-state {
      color: #dc2626;
    }

    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      margin-bottom: 10px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .card-mode {
      display: none;
      flex-wrap: wrap;
      gap: 14px;
    }

    .card {
      position: relative;
      flex: 1 1 290px;
      min-width: 280px;
      max-width: calc(33.333% - 10px);
      overflow: hidden;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .card::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      content: "";
    }

    .card.disc::before {
      background: #ef4444;
    }

    .card.cont::before {
      background: #10b981;
    }

    .card.other::before {
      background: #f59e0b;
    }

    .card-code {
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .card-name {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-word;
    }

    .card .status-badge {
      margin-bottom: 11px;
    }

    .card p {
      margin: 5px 0;
      color: var(--text-light);
      font-size: 12px;
    }

    .card p strong {
      color: var(--text);
    }

    .card-note {
      margin-top: 10px !important;
      padding-top: 9px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 1050px) {
      .card {
        max-width: calc(50% - 7px);
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
      }

      .header-section {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 16px;
      }

      .header-right {
        justify-content: space-between;
        width: 100%;
      }

      .header-title h1 {
        font-size: 23px;
      }

      .search-input-wrapper {
        flex-direction: column;
      }

      .btn-search {
        width: 100%;
      }

      .filter-group {
        flex-direction: column;
      }

      .filter-box {
        width: 100%;
        min-width: 100%;
      }

      .dropdown-menu {
        width: 100%;
        max-width: 100%;
      }

      .action-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .btn-export {
        width: 100%;
      }

      .card {
        max-width: 100%;
      }
    }

    @media (max-width: 460px) {
      .header-right {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats-bar {
        width: 100%;
      }

      .stat-item {
        flex: 1;
      }
    }

    .dropdown-menu::-webkit-scrollbar,
    .table-container::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .dropdown-menu::-webkit-scrollbar-track,
    .table-container::-webkit-scrollbar-track {
      background: var(--card-bg-hover);
    }

    .dropdown-menu::-webkit-scrollbar-thumb,
    .table-container::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: var(--border);
    }

    .dropdown-menu::-webkit-scrollbar-thumb:hover,
    .table-container::-webkit-scrollbar-thumb:hover {
      background: var(--primary-light);
    }
  </style>
</head>

<body>
  <header class="header-section">
    <div class="header-title">
      <h1>Advance Digitals</h1>
      <p>Product and Status Dashboard</p>
    </div>

    <div class="header-right">
      <div class="stats-bar" aria-label="Ringkasan produk">
        <div class="stat-item">
          <div class="stat-value" id="totalCount">0</div>
          <div class="stat-label">Total</div>
        </div>

        <div class="stat-item">
          <div class="stat-value" id="continueCount">0</div>
          <div class="stat-label">Lanjut</div>
        </div>

        <div class="stat-item">
          <div class="stat-value" id="discontinueCount">0</div>
          <div class="stat-label">Stop</div>
        </div>
      </div>

      <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Ubah tema terang atau gelap"
        aria-pressed="false"
        title="Ubah mode terang/gelap"
      >
        <span class="theme-toggle-slider" id="themeIcon">☀️</span>
      </button>
    </div>
  </header>

  <section class="search-bar">
    <div class="search-top">
      <div class="search-input-wrapper">
        <div class="search-input">
          <input
            id="search"
            type="search"
            placeholder="Cari kode, nama produk, pemasok, asal, atau catatan..."
            autocomplete="off"
          >
          <span class="search-icon-indicator" id="searchIcon">🔍</span>
        </div>

        <button class="btn-search" id="btnSearchAction" type="button">
          🔍 Cari
        </button>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-box">
        <label class="filter-label">Pemasok</label>

        <button
          class="dropdown-toggle"
          id="supplierToggle"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span id="supplierText">Semua Pemasok</span>
          <span class="dropdown-arrow">▼</span>
        </button>

        <div class="dropdown-menu" id="supplierMenu" role="menu"></div>
      </div>

      <div class="filter-box">
        <label class="filter-label">Asal</label>

        <button
          class="dropdown-toggle"
          id="originToggle"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span id="originText">Semua Asal</span>
          <span class="dropdown-arrow">▼</span>
        </button>

        <div class="dropdown-menu" id="originMenu" role="menu"></div>
      </div>

      <div class="filter-box">
        <label class="filter-label">Status</label>

        <button
          class="dropdown-toggle"
          id="statusToggle"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span id="statusText">Semua Status</span>
          <span class="dropdown-arrow">▼</span>
        </button>

        <div class="dropdown-menu" id="statusMenu" role="menu">
          <label class="dropdown-item select-all-item">
            <input type="checkbox" id="statusSelectAll">
            <span>Pilih Semua</span>
          </label>

          <label class="dropdown-item">
            <input type="checkbox" class="status-check" value="continue">
            <span>Lanjut Produksi</span>
          </label>

          <label class="dropdown-item">
            <input type="checkbox" class="status-check" value="discontinue">
            <span>Dihentikan</span>
          </label>
        </div>
      </div>
    </div>
  </section>

  <section class="action-bar">
    <div class="view-buttons">
      <button id="btnTable" class="active" type="button" aria-pressed="true">
        📋 Tabel
      </button>

      <button id="btnCard" type="button" aria-pressed="false">
        🃏 Kartu
      </button>
    </div>

    <button class="btn-export" id="btnExport" type="button">
      📊 Ekspor Excel
    </button>
  </section>

  <section id="tableView" class="table-container">
    <table id="dataTable">
      <thead>
        <tr>
          <th>Kode Material</th>
          <th>Nama Barang</th>
          <th>Pemasok</th>
          <th>Asal</th>
          <th>Status</th>
          <th>Catatan</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>
    </table>
  </section>

  <section id="cardView" class="card-mode"></section>

  <script>
    const allData = [];
    let suppliers = [];
    let origins = [];

    const selected = {
      supplier: new Set(),
      origin: new Set(),
      status: new Set()
    };

    const dom = {};

    function initDomCache() {
      dom.search = document.getElementById("search");
      dom.searchIcon = document.getElementById("searchIcon");
      dom.btnSearch = document.getElementById("btnSearchAction");
      dom.btnExport = document.getElementById("btnExport");

      dom.supplierMenu = document.getElementById("supplierMenu");
      dom.originMenu = document.getElementById("originMenu");
      dom.statusMenu = document.getElementById("statusMenu");

      dom.supplierText = document.getElementById("supplierText");
      dom.originText = document.getElementById("originText");
      dom.statusText = document.getElementById("statusText");

      dom.supplierToggle = document.getElementById("supplierToggle");
      dom.originToggle = document.getElementById("originToggle");
      dom.statusToggle = document.getElementById("statusToggle");

      dom.statusSelectAll = document.getElementById("statusSelectAll");

      dom.tableBody = document.getElementById("tableBody");
      dom.tableView = document.getElementById("tableView");
      dom.cardView = document.getElementById("cardView");

      dom.btnTable = document.getElementById("btnTable");
      dom.btnCard = document.getElementById("btnCard");

      dom.totalCount = document.getElementById("totalCount");
      dom.continueCount = document.getElementById("continueCount");
      dom.discontinueCount = document.getElementById("discontinueCount");

      dom.themeToggle = document.getElementById("themeToggle");
      dom.themeIcon = document.getElementById("themeIcon");
    }

    function escapeHtml(value) {
      const element = document.createElement("div");
      element.textContent = String(value ?? "");
      return element.innerHTML;
    }

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    function isDiscontinued(status) {
      const s = normalize(status);

      return (
        s.includes("discontinue") ||
        s.includes("dihentikan") ||
        s.includes("stop") ||
        s.includes("停产") ||
        s.includes("停止生产")
      );
    }

    function isContinuing(status) {
      const s = normalize(status);

      if (isDiscontinued(s)) {
        return false;
      }

      return (
        s === "continue" ||
        s.includes("continue produksi") ||
        s.includes("lanjut produksi") ||
        s.includes("lanjut") ||
        s.includes("继续") ||
        s.includes("生产继续")
      );
    }

    function getStatusClass(status) {
      if (isDiscontinued(status)) return "disc";
      if (isContinuing(status)) return "cont";
      return "other";
    }

    function parseCSVLine(line) {
      const values = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const character = line[i];

        if (character === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (character === "," && !inQuotes) {
          values.push(current.trim());
          current = "";
        } else {
          current += character;
        }
      }

      values.push(current.trim());
      return values;
    }

    function parseCSV(text) {
      const cleanText = text.replace(/^\uFEFF/, "").trim();

      if (!cleanText) {
        showEmptyState("File CSV kosong.");
        return;
      }

      const lines = cleanText.split(/\r?\n/);

      if (lines.length < 2) {
        showEmptyState("CSV hanya memiliki header atau tidak memiliki data.");
        return;
      }

      const supplierSet = new Set();
      const originSet = new Set();

      allData.length = 0;

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;

        const row = parseCSVLine(lines[i]);

        const record = {
          code: (row[0] || "").trim(),
          name: (row[1] || "").trim(),
          supplier: (row[2] || "").trim(),
          origin: (row[3] || "").trim(),
          status: (row[4] || "").trim(),
          note: (row[5] || "").trim()
        };

        allData.push(record);

        if (record.supplier) supplierSet.add(record.supplier);
        if (record.origin) originSet.add(record.origin);
      }

      suppliers = [...supplierSet].sort((a, b) => a.localeCompare(b));
      origins = [...originSet].sort((a, b) => a.localeCompare(b));

      renderSupplierMenu();
      renderOriginMenu();
      syncStatusSelectAll();
      applyFilters();
    }

    function createMenuItem({ labelText, className, value, id }) {
      const label = document.createElement("label");
      label.className = className;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";

      if (value !== undefined) checkbox.value = value;
      if (id) checkbox.id = id;

      const text = document.createElement("span");
      text.textContent = labelText;

      label.append(checkbox, text);
      return label;
    }

    function renderSupplierMenu() {
      const fragment = document.createDocumentFragment();

      fragment.appendChild(
        createMenuItem({
          labelText: "Pilih Semua",
          className: "dropdown-item select-all-item",
          id: "supplierSelectAll"
        })
      );

      suppliers.forEach((supplier) => {
        const item = createMenuItem({
          labelText: supplier,
          className: "dropdown-item supplier-item",
          value: supplier
        });

        const checkbox = item.querySelector("input");
        checkbox.classList.add("supplier-check");
        checkbox.checked = selected.supplier.has(supplier);

        fragment.appendChild(item);
      });

      dom.supplierMenu.replaceChildren(fragment);
      syncSupplierSelectAll();
    }

    function renderOriginMenu() {
      const fragment = document.createDocumentFragment();

      fragment.appendChild(
        createMenuItem({
          labelText: "Pilih Semua",
          className: "dropdown-item select-all-item",
          id: "originSelectAll"
        })
      );

      origins.forEach((origin) => {
        const item = createMenuItem({
          labelText: origin,
          className: "dropdown-item origin-item",
          value: origin
        });

        const checkbox = item.querySelector("input");
        checkbox.classList.add("origin-check");
        checkbox.checked = selected.origin.has(origin);

        fragment.appendChild(item);
      });

      dom.originMenu.replaceChildren(fragment);
      syncOriginSelectAll();
    }

    function syncSelectAll(menu, itemSelector, selectAllSelector) {
      const itemCheckboxes = [...menu.querySelectorAll(itemSelector)];
      const selectAll = menu.querySelector(selectAllSelector);

      if (!selectAll) return;

      const countChecked = itemCheckboxes.filter((checkbox) => checkbox.checked).length;

      selectAll.checked = itemCheckboxes.length > 0 && countChecked === itemCheckboxes.length;
      selectAll.indeterminate = countChecked > 0 && countChecked < itemCheckboxes.length;
    }

    function syncSupplierSelectAll() {
      syncSelectAll(
        dom.supplierMenu,
        ".supplier-check",
        "#supplierSelectAll"
      );
    }

    function syncOriginSelectAll() {
      syncSelectAll(
        dom.originMenu,
        ".origin-check",
        "#originSelectAll"
      );
    }

    function syncStatusSelectAll() {
      syncSelectAll(
        dom.statusMenu,
        ".status-check",
        "#statusSelectAll"
      );
    }

    function updateToggleText(type) {
      const selectedSet = selected[type];
      const target = dom[`${type}Text`];

      const labels = {
        supplier: "Semua Pemasok",
        origin: "Semua Asal",
        status: "Semua Status"
      };

      if (selectedSet.size === 0) {
        target.textContent = labels[type];
        return;
      }

      if (selectedSet.size === 1) {
        if (type === "status") {
          target.textContent = selectedSet.has("continue")
            ? "Lanjut Produksi"
            : "Dihentikan";
        } else {
          target.textContent = [...selectedSet][0];
        }
        return;
      }

      target.textContent = `${selectedSet.size} dipilih`;
    }

    function getFilteredData() {
      const keyword = normalize(dom.search.value);

      return allData.filter((item) => {
        const matchKeyword =
          !keyword ||
          [
            item.code,
            item.name,
            item.supplier,
            item.origin,
            item.status,
            item.note
          ].some((value) => normalize(value).includes(keyword));

        const matchSupplier =
          selected.supplier.size === 0 ||
          selected.supplier.has(item.supplier);

        const matchOrigin =
          selected.origin.size === 0 ||
          selected.origin.has(item.origin);

        let matchStatus = true;

        if (selected.status.size > 0) {
          const matchesContinue =
            selected.status.has("continue") &&
            isContinuing(item.status);

          const matchesDiscontinue =
            selected.status.has("discontinue") &&
            isDiscontinued(item.status);

          matchStatus = matchesContinue || matchesDiscontinue;
        }

        return matchKeyword && matchSupplier && matchOrigin && matchStatus;
      });
    }

    function updateStats(filteredData) {
      const total = filteredData.length;

      const continueCount = filteredData.filter((item) => {
        return isContinuing(item.status);
      }).length;

      const discontinueCount = filteredData.filter((item) => {
        return isDiscontinued(item.status);
      }).length;

      dom.totalCount.textContent = total;
      dom.continueCount.textContent = continueCount;
      dom.discontinueCount.textContent = discontinueCount;
    }

    function updateSearchIndicator() {
      const hasActiveSearch =
        dom.search.value.trim() !== "" ||
        selected.supplier.size > 0 ||
        selected.origin.size > 0 ||
        selected.status.size > 0;

      dom.searchIcon.classList.toggle("active", hasActiveSearch);
    }

    function renderTable(data) {
      if (data.length === 0) {
        dom.tableBody.innerHTML = "";
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach((item) => {
        const row = document.createElement("tr");
        const statusClass = getStatusClass(item.status);

        row.innerHTML = `
          <td><span class="material-code">${escapeHtml(item.code)}</span></td>
          <td>${escapeHtml(item.name)}</td>
          <td>${escapeHtml(item.supplier)}</td>
          <td>${escapeHtml(item.origin)}</td>
          <td>
            <span class="status-badge status-${statusClass}">
              ${escapeHtml(item.status || "-")}
            </span>
          </td>
          <td>${escapeHtml(item.note) || '<span style="color: var(--text-muted)">-</span>'}</td>
        `;

        fragment.appendChild(row);
      });

      dom.tableBody.replaceChildren(fragment);
    }

    function renderCards(data) {
      if (data.length === 0) {
        dom.cardView.innerHTML = "";
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach((item) => {
        const statusClass = getStatusClass(item.status);
        const card = document.createElement("article");

        card.className = `card ${statusClass}`;

        card.innerHTML = `
          <div class="card-code">${escapeHtml(item.code)}</div>
          <h3 class="card-name">${escapeHtml(item.name)}</h3>

          <span class="status-badge status-${statusClass}">
            ${escapeHtml(item.status || "-")}
          </span>

          <p><strong>Pemasok:</strong> ${escapeHtml(item.supplier || "-")}</p>
          <p><strong>Asal:</strong> ${escapeHtml(item.origin || "-")}</p>
          <p class="card-note">${escapeHtml(item.note) || "Tidak ada catatan"}</p>
        `;

        fragment.appendChild(card);
      });

      dom.cardView.replaceChildren(fragment);
    }

    function showEmptyState(message) {
      dom.tableBody.innerHTML = `
        <tr>
          <td class="empty-cell" colspan="6">
            <div class="empty-state">
              <strong>${escapeHtml(message)}</strong>
            </div>
          </td>
        </tr>
      `;

      dom.cardView.innerHTML = `
        <div class="empty-state" style="width: 100%;">
          <strong>${escapeHtml(message)}</strong>
        </div>
      `;

      updateStats([]);
    }

    function showNoResult() {
      dom.tableBody.innerHTML = `
        <tr>
          <td class="empty-cell" colspan="6">
            <div class="empty-state">
              <strong>Tidak ada hasil ditemukan.</strong>
              <div style="margin-top: 6px;">Ubah kata kunci atau pilihan filter Anda.</div>
            </div>
          </td>
        </tr>
      `;

      dom.cardView.innerHTML = `
        <div class="empty-state" style="width: 100%;">
          <strong>Tidak ada hasil ditemukan.</strong>
          <div style="margin-top: 6px;">Ubah kata kunci atau pilihan filter Anda.</div>
        </div>
      `;
    }

    function applyFilters() {
      const filteredData = getFilteredData();

      updateStats(filteredData);
      updateSearchIndicator();

      if (filteredData.length === 0 && allData.length > 0) {
        showNoResult();
        return;
      }

      renderTable(filteredData);
      renderCards(filteredData);
    }

    function closeAllDropdowns() {
      document.querySelectorAll(".dropdown-menu").forEach((menu) => {
        menu.classList.remove("open");
      });

      document.querySelectorAll(".dropdown-toggle").forEach((toggle) => {
        toggle.classList.remove("active");
        toggle.setAttribute("aria-expanded", "false");
      });
    }

    function setupDropdown(toggle, menu) {
      toggle.addEventListener("click", (event) => {
        event.stopPropagation();

        const isOpen = menu.classList.contains("open");

        closeAllDropdowns();

        if (!isOpen) {
          menu.classList.add("open");
          toggle.classList.add("active");
          toggle.setAttribute("aria-expanded", "true");
        }
      });

      menu.addEventListener("click", (event) => {
        event.stopPropagation();
      });
    }

    function handleSupplierFilter(event) {
      const target = event.target;

      if (target.id === "supplierSelectAll") {
        const shouldCheckAll = target.checked;
        const checkboxes = dom.supplierMenu.querySelectorAll(".supplier-check");

        selected.supplier.clear();

        checkboxes.forEach((checkbox) => {
          checkbox.checked = shouldCheckAll;

          if (shouldCheckAll) {
            selected.supplier.add(checkbox.value);
          }
        });

        syncSupplierSelectAll();
        updateToggleText("supplier");
        applyFilters();
        return;
      }

      if (target.classList.contains("supplier-check")) {
        if (target.checked) {
          selected.supplier.add(target.value);
        } else {
          selected.supplier.delete(target.value);
        }

        syncSupplierSelectAll();
        updateToggleText("supplier");
        applyFilters();
      }
    }

    function handleOriginFilter(event) {
      const target = event.target;

      if (target.id === "originSelectAll") {
        const shouldCheckAll = target.checked;
        const checkboxes = dom.originMenu.querySelectorAll(".origin-check");

        selected.origin.clear();

        checkboxes.forEach((checkbox) => {
          checkbox.checked = shouldCheckAll;

          if (shouldCheckAll) {
            selected.origin.add(checkbox.value);
          }
        });

        syncOriginSelectAll();
        updateToggleText("origin");
        applyFilters();
        return;
      }

      if (target.classList.contains("origin-check")) {
        if (target.checked) {
          selected.origin.add(target.value);
        } else {
          selected.origin.delete(target.value);
        }

        syncOriginSelectAll();
        updateToggleText("origin");
        applyFilters();
      }
    }

    function handleStatusFilter(event) {
      const target = event.target;

      if (target.id === "statusSelectAll") {
        const shouldCheckAll = target.checked;
        const checkboxes = dom.statusMenu.querySelectorAll(".status-check");

        selected.status.clear();

        checkboxes.forEach((checkbox) => {
          checkbox.checked = shouldCheckAll;

          if (shouldCheckAll) {
            selected.status.add(checkbox.value);
          }
        });

        syncStatusSelectAll();
        updateToggleText("status");
        applyFilters();
        return;
      }

      if (target.classList.contains("status-check")) {
        if (target.checked) {
          selected.status.add(target.value);
        } else {
          selected.status.delete(target.value);
        }

        syncStatusSelectAll();
        updateToggleText("status");
        applyFilters();
      }
    }

    function setView(view) {
      const tableMode = view === "table";

      dom.tableView.style.display = tableMode ? "block" : "none";
      dom.cardView.style.display = tableMode ? "none" : "flex";

      dom.btnTable.classList.toggle("active", tableMode);
      dom.btnCard.classList.toggle("active", !tableMode);

      dom.btnTable.setAttribute("aria-pressed", String(tableMode));
      dom.btnCard.setAttribute("aria-pressed", String(!tableMode));
    }

    /*
      Tema selalu dimulai dari LIGHT MODE.
      Tidak mengambil preferensi browser dan tidak memakai localStorage.
    */
    function initTheme() {
      const theme = "light";

      document.documentElement.setAttribute("data-theme", theme);
      updateThemeButton(theme);
    }

    function updateThemeButton(theme) {
      const isDark = theme === "dark";

      dom.themeToggle.classList.toggle("active", isDark);
      dom.themeToggle.setAttribute("aria-pressed", String(isDark));
      dom.themeIcon.textContent = isDark ? "🌙" : "☀️";
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const nextTheme = currentTheme === "dark" ? "light" : "dark";

      document.documentElement.setAttribute("data-theme", nextTheme);
      updateThemeButton(nextTheme);
    }

    function exportToExcel() {
      const filteredData = getFilteredData();

      const escapeCSV = (value) => {
        return `"${String(value || "").replace(/"/g, '""')}"`;
      };

      const separator = ";";

      let csv = "\uFEFF";

      csv += [
        "Kode Material",
        "Nama Barang",
        "Pemasok",
        "Asal",
        "Status",
        "Catatan"
      ].map(escapeCSV).join(separator) + "\n";

      filteredData.forEach((item) => {
        csv += [
          item.code,
          item.name,
          item.supplier,
          item.origin,
          item.status,
          item.note
        ].map(escapeCSV).join(separator) + "\n";
      });

      const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      const today = new Date()
        .toLocaleDateString("id-ID")
        .replace(/\//g, "-");

      link.href = url;
      link.download = `Product_Advance_${today}.csv`;

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

    async function loadData() {
      dom.tableBody.innerHTML = `
        <tr>
          <td class="empty-cell" colspan="6">
            <div class="loading">
              <div class="loading-spinner"></div>
              <div>Memuat data...</div>
            </div>
          </td>
        </tr>
      `;

      try {
        const response = await fetch("data.csv", { cache: "no-store" });

        if (!response.ok) {
          throw new Error(\`HTTP \${response.status}\`);
        }

        const text = await response.text();
        parseCSV(text);
      } catch (error) {
        dom.tableBody.innerHTML = `
          <tr>
            <td class="empty-cell" colspan="6">
              <div class="error-state">
                <strong>Gagal memuat data.csv</strong>
                <div style="margin-top: 7px; font-size: 12px;">
                  Pastikan file data.csv berada pada folder yang sama dengan index.html.
                </div>
                <div style="margin-top: 5px; font-size: 11px; opacity: 0.8;">
                  ${escapeHtml(error.message)}
                </div>
              </div>
            </td>
          </tr>
        `;
      }
    }

    function debounce(callback, delay = 120) {
      let timer;

      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => callback(...args), delay);
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      initDomCache();
      initTheme();

      setupDropdown(dom.supplierToggle, dom.supplierMenu);
      setupDropdown(dom.originToggle, dom.originMenu);
      setupDropdown(dom.statusToggle, dom.statusMenu);

      document.addEventListener("click", closeAllDropdowns);

      dom.supplierMenu.addEventListener("change", handleSupplierFilter);
      dom.originMenu.addEventListener("change", handleOriginFilter);
      dom.statusMenu.addEventListener("change", handleStatusFilter);

      const searchDebounced = debounce(applyFilters, 120);

      dom.search.addEventListener("input", searchDebounced);

      dom.search.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          applyFilters();
        }
      });

      dom.btnSearch.addEventListener("click", applyFilters);
      dom.btnExport.addEventListener("click", exportToExcel);

      dom.btnTable.addEventListener("click", () => setView("table"));
      dom.btnCard.addEventListener("click", () => setView("card"));

      dom.themeToggle.addEventListener("click", toggleTheme);

      loadData();
    });
  </script>
</body>
</html>
