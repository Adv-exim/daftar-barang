<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advance Digitals — Product and Status</title>

  <style>
    :root {
      --primary: #0f8b93;
      --primary-dark: #0b7077;
      --primary-light: #27b9c1;
      --accent-gradient: linear-gradient(135deg, #12b7c5, #087f83);

      --bg: #f2f7f8;
      --bg-gradient: linear-gradient(135deg, #f7fbfc 0%, #edf4f6 100%);
      --card-bg: #ffffff;
      --card-bg-hover: #f7fbfc;
      --border: #dfe8eb;

      --text: #334155;
      --text-light: #64748b;
      --text-muted: #94a3b8;

      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 3px 9px rgba(15, 23, 42, 0.10);
      --shadow-lg: 0 12px 24px rgba(15, 23, 42, 0.14);
      --shadow-glow: 0 0 18px rgba(18, 183, 197, 0.17);

      --radius: 12px;
      --radius-sm: 8px;

      --status-disc-bg: #fff4f4;
      --status-disc-text: #a82929;
      --status-disc-border: #f3b4b4;

      --status-cont-bg: #ecfdf6;
      --status-cont-text: #08784f;
      --status-cont-border: #92dfbd;

      --status-other-bg: #fff9e7;
      --status-other-text: #95630e;
      --status-other-border: #f6d87c;

      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.55);
    }

    [data-theme="dark"] {
      --primary: #22c5cb;
      --primary-dark: #11979e;
      --primary-light: #5ee7e9;
      --accent-gradient: linear-gradient(135deg, #20c8d2, #149b9e);

      --bg: #111c2a;
      --bg-gradient: linear-gradient(135deg, #101b29 0%, #1b2a3b 100%);
      --card-bg: #1c2b3d;
      --card-bg-hover: #263a50;
      --border: #35495e;

      --text: #e6edf5;
      --text-light: #b2c0d0;
      --text-muted: #8ea0b5;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.30);
      --shadow-md: 0 4px 10px rgba(0, 0, 0, 0.34);
      --shadow-lg: 0 12px 26px rgba(0, 0, 0, 0.44);
      --shadow-glow: 0 0 18px rgba(34, 197, 203, 0.16);

      --status-disc-bg: rgba(239, 68, 68, 0.13);
      --status-disc-text: #fca5a5;
      --status-disc-border: rgba(252, 165, 165, 0.42);

      --status-cont-bg: rgba(16, 185, 129, 0.13);
      --status-cont-text: #86efac;
      --status-cont-border: rgba(134, 239, 172, 0.36);

      --status-other-bg: rgba(234, 179, 8, 0.13);
      --status-other-text: #fde68a;
      --status-other-border: rgba(253, 230, 138, 0.35);

      --glass-bg: rgba(28, 43, 61, 0.89);
      --glass-border: rgba(255, 255, 255, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      max-width: 1450px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px;
      background: var(--bg-gradient);
      color: var(--text);
      font-family: "Segoe UI", Inter, Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      transition: background 0.25s ease, color 0.25s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-title h1 {
      margin: 0 0 3px;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title p {
      margin: 0;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }

    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 14px;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-item {
      min-width: 70px;
      padding: 6px 12px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg-hover);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .stat-item:hover {
      border-color: var(--primary-light);
      box-shadow: var(--shadow-sm);
    }

    .stat-value {
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.15;
    }

    .stat-label {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    .theme-toggle {
      position: relative;
      width: 64px;
      height: 32px;
      padding: 0;
      border: 2px solid var(--border);
      border-radius: 999px;
      background: #dfe7ee;
      box-shadow: none;
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .theme-toggle:hover {
      border-color: var(--primary-light);
      box-shadow: var(--shadow-glow);
      transform: none;
    }

    .theme-toggle.active {
      border-color: transparent;
      background: var(--accent-gradient);
    }

    .theme-toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
      font-size: 14px;
      line-height: 1;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .theme-toggle.active .theme-toggle-slider {
      transform: translateX(32px);
    }

    .search-bar {
      position: relative;
      z-index: 20;
      overflow: visible;
      padding: 15px 18px;
      margin-bottom: 15px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .search-bar::before {
      position: absolute;
      top: -1px;
      right: -1px;
      left: -1px;
      height: 3px;
      content: "";
      border-radius: 12px 12px 0 0;
      background: var(--accent-gradient);
    }

    .search-top {
      display: flex;
      margin-bottom: 12px;
    }

    .search-input-wrapper {
      display: flex;
      flex: 1;
      gap: 10px;
      min-width: 0;
    }

    .search-input {
      position: relative;
      flex: 1;
      min-width: 180px;
    }

    .search-input input {
      width: 100%;
      height: 44px;
      padding: 10px 44px 10px 14px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      background: var(--card-bg-hover);
      font-size: 13px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .search-input input::placeholder {
      color: var(--text-muted);
    }

    .search-input input:focus {
      border-color: var(--primary-light);
      background: var(--card-bg);
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.13);
    }

    .search-icon-indicator {
      position: absolute;
      top: 50%;
      right: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 0.2s ease;
      font-size: 16px;
    }

    .search-icon-indicator.active {
      opacity: 1;
    }

    .btn-search,
    .btn-export {
      color: #ffffff !important;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent-gradient);
      box-shadow: 0 2px 6px rgba(15, 118, 122, 0.25);
      font-size: 13px;
      font-weight: 650;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-search {
      height: 44px;
      padding: 0 20px;
      white-space: nowrap;
    }

    .btn-export {
      padding: 10px 20px;
      white-space: nowrap;
    }

    .btn-search:hover,
    .btn-export:hover {
      color: #ffffff !important;
      filter: brightness(1.04);
      box-shadow: 0 6px 14px rgba(15, 118, 122, 0.30);
      transform: translateY(-1px);
    }

    .btn-search:active,
    .btn-export:active {
      transform: translateY(0);
    }

    .filter-group {
      position: relative;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .filter-box {
      position: relative;
      flex: 1;
      min-width: 205px;
    }

    .filter-label {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 12px;
      font-weight: 650;
    }

    .dropdown-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 42px;
      padding: 9px 12px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg-hover);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .dropdown-toggle:hover,
    .dropdown-toggle.active {
      color: var(--text);
      border-color: var(--primary-light);
      background: var(--card-bg);
      box-shadow: var(--shadow-glow);
      transform: none;
    }

    .dropdown-arrow {
      flex: 0 0 auto;
      margin-left: 10px;
      color: var(--text-muted);
      font-size: 10px;
      transition: transform 0.2s ease;
    }

    .dropdown-toggle.active .dropdown-arrow {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 1000;
      display: none;
      width: max-content;
      min-width: 100%;
      max-width: min(390px, calc(100vw - 48px));
      max-height: 300px;
      padding: 5px 0;
      overflow-x: hidden;
      overflow-y: auto;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      box-shadow: var(--shadow-lg);
    }

    .dropdown-menu.open {
      display: block;
      animation: slideDown 0.16s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
      padding: 8px 14px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      line-height: 1.35;
      transition: background 0.15s ease;
    }

    .dropdown-item:hover {
      color: var(--text);
      background: var(--card-bg-hover);
    }

    .dropdown-item span {
      overflow-wrap: anywhere;
    }

    .dropdown-item input[type="checkbox"] {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .select-all-item {
      position: sticky;
      top: -5px;
      z-index: 2;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg-hover);
    }

    .select-all-item:hover {
      background: var(--card-bg-hover);
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 15px;
    }

    .view-buttons {
      display: flex;
      gap: 8px;
    }

    .view-buttons button {
      padding: 9px 16px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      font-size: 13px;
      font-weight: 650;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .view-buttons button:hover {
      color: var(--text);
      border-color: var(--primary-light);
      background: var(--card-bg-hover);
      box-shadow: var(--shadow-sm);
      transform: none;
    }

    .view-buttons button.active {
      color: #ffffff !important;
      border-color: transparent;
      background: var(--accent-gradient);
      box-shadow: 0 3px 8px rgba(15, 118, 122, 0.22);
    }

    .table-container {
      max-height: 72vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      box-shadow: var(--shadow-md);
    }

    table {
      width: 100%;
      min-width: 920px;
      border-spacing: 0;
      border-collapse: separate;
      background: var(--card-bg);
    }

    th {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 13px 14px;
      color: #ffffff;
      border-bottom: 2px solid rgba(255, 255, 255, 0.18);
      background: var(--accent-gradient);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 13px;
      vertical-align: middle;
      transition: background 0.16s ease;
    }

    tbody tr:hover td {
      background: var(--card-bg-hover);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .material-code {
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .status-disc {
      color: var(--status-disc-text);
      border-color: var(--status-disc-border);
      background: var(--status-disc-bg);
    }

    .status-cont {
      color: var(--status-cont-text);
      border-color: var(--status-cont-border);
      background: var(--status-cont-bg);
    }

    .status-other {
      color: var(--status-other-text);
      border-color: var(--status-other-border);
      background: var(--status-other-bg);
    }

    .empty-cell {
      padding: 0 !important;
    }

    .empty-state,
    .loading,
    .error-state {
      padding: 54px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-state strong,
    .error-state strong {
      color: var(--text);
    }

    .error-state {
      color: #dc2626;
    }

    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      margin-bottom: 10px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .card-mode {
      display: none;
      flex-wrap: wrap;
      gap: 14px;
    }

    .card {
      position: relative;
      flex: 1 1 290px;
      min-width: 280px;
      max-width: calc(33.333% - 10px);
      overflow: hidden;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .card::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      content: "";
    }

    .card.disc::before {
      background: #ef4444;
    }

    .card.cont::before {
      background: #10b981;
    }

    .card.other::before {
      background: #f59e0b;
    }

    .card-code {
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .card-name {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-word;
    }

    .card .status-badge {
      margin-bottom: 11px;
    }

    .card p {
      margin: 5px 0;
      color: var(--text-light);
      font-size: 12px;
    }

    .card p strong {
      color: var(--text);
    }

    .card-note {
      margin-top: 10px !important;
      padding-top: 9px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 1050px) {
      .card {
        max-width: calc(50% - 7px);
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
      }

      .header-section {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 16px;
      }

      .header-right {
        justify-content: space-between;
        width: 100%;
      }

      .header-title h1 {
        font-size: 23px;
      }

      .search-input-wrapper {
        flex-direction: column;
      }

      .btn-search {
        width: 100%;
      }

      .filter-group {
        flex-direction: column;
      }

      .filter-box {
        width: 100%;
        min-width: 100%;
      }

      .dropdown-menu {
        width: 100%;
        max-width: 100%;
      }

      .action-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .btn-export {
        width: 100%;
      }

      .card {
        max-width: 100%;
      }
    }

    @media (max-width: 460px) {
      .header-right {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats-bar {
        width: 100%;
      }

      .stat-item {
        flex: 1;
      }
    }


    .dashboard-toggle {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 13px;
      background: var(--card-bg);
      color: var(--text);
      font-weight: 700;
      box-shadow: var(--shadow-sm);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .dashboard-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--primary);
      background: var(--card-bg-hover);
    }
    .stats-bar[hidden] { display: none !important; }
    .header-right { gap: 12px; }
    @media (max-width: 600px) {
      .header-right { width: 100%; flex-wrap: wrap; }
      .dashboard-toggle { flex: 1 1 auto; }
    }

    .dropdown-menu::-webkit-scrollbar,
    .table-container::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .dropdown-menu::-webkit-scrollbar-track,
    .table-container::-webkit-scrollbar-track {
      background: var(--card-bg-hover);
    }

    .dropdown-menu::-webkit-scrollbar-thumb,
    .table-container::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: var(--border);
    }

    .dropdown-menu::-webkit-scrollbar-thumb:hover,
    .table-container::-webkit-scrollbar-thumb:hover {
      background: var(--primary-light);
    }

  /* =========================================================
     MODERN UI REFRESH — visual layer only
     Seluruh struktur HTML, ID, dan JavaScript lama dipertahankan.
     ========================================================= */
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #60a5fa;
    --accent-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    --bg: #f4f6fb;
    --bg-gradient: linear-gradient(180deg, #f7f9fd 0%, #f1f4fa 100%);
    --card-bg: #ffffff;
    --card-bg-hover: #f8faff;
    --border: #e5eaf3;
    --text: #172033;
    --text-light: #65718a;
    --text-muted: #8d98ad;
    --shadow-sm: 0 1px 2px rgba(20, 34, 66, .04), 0 2px 8px rgba(20, 34, 66, .04);
    --shadow-md: 0 8px 24px rgba(20, 34, 66, .07);
    --shadow-lg: 0 18px 44px rgba(20, 34, 66, .12);
    --shadow-glow: 0 8px 22px rgba(37, 99, 235, .20);
    --radius: 18px;
    --radius-sm: 12px;
    --status-disc-bg: #fff1f2;
    --status-disc-text: #be123c;
    --status-disc-border: #fecdd3;
    --status-cont-bg: #ecfdf5;
    --status-cont-text: #047857;
    --status-cont-border: #a7f3d0;
    --status-other-bg: #fffbeb;
    --status-other-text: #a16207;
    --status-other-border: #fde68a;
    --glass-bg: rgba(255,255,255,.92);
    --glass-border: rgba(255,255,255,.55);
  }

  [data-theme="dark"] {
    --primary: #7aa7ff;
    --primary-dark: #4f83ed;
    --primary-light: #a8c5ff;
    --accent-gradient: linear-gradient(135deg, #376ed8 0%, #6558d9 100%);
    --bg: #0c1220;
    --bg-gradient: linear-gradient(180deg, #0c1220 0%, #111a2b 100%);
    --card-bg: #151f31;
    --card-bg-hover: #1b2940;
    --border: #29364c;
    --text: #edf2fb;
    --text-light: #b4c0d4;
    --text-muted: #8492aa;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.20);
    --shadow-md: 0 8px 24px rgba(0,0,0,.20);

    --status-cont-text: #6ee7b7;
    --status-cont-border: rgba(110,231,183,.25);
    --status-other-bg: rgba(234,179,8,.13);

    --status-other-border: rgba(253,230,138,.25);

    --glass-border: rgba(255,255,255,.07);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); scroll-behavior: smooth; }
  body {
    width: min(100% - 40px, 1540px);

    padding: 28px 0 42px;

  }
  button, input, select { font: inherit; }

  button:focus-visible, input:focus-visible, select:focus-visible {

  .header-section {

  .header-section::after {

  .header-title, .header-right { position: relative; z-index: 1; }
  .header-title h1 {
    margin: 0 0 5px;

  .dashboard-toggle, .theme-toggle {

  .dashboard-toggle:hover, .theme-toggle:hover { transform: translateY(-2px); background: rgba(255,255,255,.22); }
  .stats-bar {
    display: flex;
    align-items: stretch;
    gap: 8px;
    padding: 7px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;
    background: rgba(12,26,75,.28);
    backdrop-filter: blur(12px);
  }
  .stat-item { min-width: 76px; padding: 5px 11px; text-align: center; }
  .stat-value { color: #fff; font-size: 21px; font-weight: 800; line-height: 1.2; }
  .stat-label { margin-top: 3px; color: rgba(235,242,255,.72); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  .search-bar {
    margin: 0 0 16px;
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card-bg);
    box-shadow: var(--shadow-sm);

  .search-top { margin-bottom: 18px; }
  .search-input-wrapper { display: flex; align-items: center; gap: 10px; }
  .search-input { position: relative; flex: 1; min-width: 0; }
  .search-input input {

    padding: 0 48px 0 16px;
    border: 1px solid var(--border);
    border-radius: 12px;

  .search-icon-indicator { position: absolute; top: 50%; right: 16px; transform: translateY(-50%); opacity: .65; }
  .btn-search, .btn-export {

  .btn-search:hover, .btn-export:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 10px 25px rgba(37,99,235,.25); }
  .filter-group { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .filter-box { position: relative; min-width: 0; }
  .filter-label { display: block; margin: 0 0 7px; color: var(--text-light); font-size: 11px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; }
  .dropdown-toggle {
    display: flex;
    align-items: center;

  .dropdown-toggle:hover, .dropdown-toggle[aria-expanded="true"] { border-color: var(--primary); background: var(--card-bg-hover); }
  .dropdown-arrow { color: var(--text-muted); font-size: 10px; }
  .dropdown-menu {
    z-index: 20;

  .action-bar {

  #dataTable tbody td { padding: 13px 15px; border-bottom: 1px solid var(--border); color: var(--text-light); vertical-align: middle; }
  #dataTable tbody tr { transition: background .15s ease; }
  #dataTable tbody tr:nth-child(even) { background: color-mix(in srgb, var(--bg) 42%, transparent); }
  #dataTable tbody tr:hover { background: var(--card-bg-hover); }
  #dataTable tbody tr:last-child td { border-bottom: 0; }
  #dataTable tbody td:first-child { color: var(--text); font-weight: 750; }
  .material-code, .card-code { display: inline-flex; align-items: center; padding: 4px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; }
  .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid transparent; border-radius: 999px; font-size: 10px; font-weight: 800; white-space: nowrap; }
  .card-mode { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card-mode > * { border: 1px solid var(--border); border-radius: 16px; background: var(--card-bg); box-shadow: var(--shadow-sm); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .card-mode > *:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); box-shadow: var(--shadow-md); }
  .card-name { color: var(--text); font-size: 15px; font-weight: 750; line-height: 1.35; }
  .card-note { color: var(--text-light); font-size: 12px; line-height: 1.6; }
  .empty-state, .loading, .error-state { color: var(--text-light); }
  .loading-spinner { border-color: var(--border); border-top-color: var(--primary); }

  @media (max-width: 760px) {
    body { width: min(100% - 24px, 1540px); padding: 12px 0 28px; }
    .header-section { min-height: 0; align-items: flex-start; flex-direction: column; gap: 18px; margin-bottom: 14px; padding: 22px 20px; border-radius: 19px; }
    .header-right { width: 100%; justify-content: flex-start; }
    .stats-bar { order: 3; width: 100%; justify-content: space-around; }

  @media (max-width: 420px) {

  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script>
    /*
      Jika data.csv sejajar dengan index.html di GitHub Pages:
      repository/
      ├── index.html
      └── data.csv

      biarkan nilainya "./data.csv".
    */
    const CSV_PATH = "./data.csv";

    const allData = [];
    let suppliers = [];
    let origins = [];

    const selected = {
      supplier: new Set(),
      origin: new Set(),
      status: new Set()
    };

    const dom = {};

    function initDomCache() {
      dom.search = document.getElementById("search");
      dom.searchIcon = document.getElementById("searchIcon");
      dom.btnSearch = document.getElementById("btnSearchAction");
      dom.btnExport = document.getElementById("btnExport");
      dom.dashboardToggle = document.getElementById("dashboardToggle");
      dom.dashboardStats = document.getElementById("dashboardStats");

      dom.supplierMenu = document.getElementById("supplierMenu");
      dom.originMenu = document.getElementById("originMenu");
      dom.statusMenu = document.getElementById("statusMenu");

      dom.supplierText = document.getElementById("supplierText");
      dom.originText = document.getElementById("originText");
      dom.statusText = document.getElementById("statusText");

      dom.supplierToggle = document.getElementById("supplierToggle");
      dom.originToggle = document.getElementById("originToggle");
      dom.statusToggle = document.getElementById("statusToggle");

      dom.tableBody = document.getElementById("tableBody");
      dom.tableView = document.getElementById("tableView");
      dom.cardView = document.getElementById("cardView");

      dom.btnTable = document.getElementById("btnTable");
      dom.btnCard = document.getElementById("btnCard");

      dom.totalCount = document.getElementById("totalCount");
      dom.continueCount = document.getElementById("continueCount");
      dom.discontinueCount = document.getElementById("discontinueCount");

      dom.themeToggle = document.getElementById("themeToggle");
      dom.themeIcon = document.getElementById("themeIcon");
    }

    function escapeHtml(value) {
      const element = document.createElement("div");
      element.textContent = String(value ?? "");
      return element.innerHTML;
    }

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    /*
      Catatan penting:
      "DISCONTINUE" mengandung teks "CONTINUE".
      Maka status berhenti diperiksa lebih dahulu agar statistik benar.
    */
    function isDiscontinued(status) {
      const s = normalize(status);

      return (
        s.includes("discontinue") ||
        s.includes("dihentikan") ||
        s.includes("stop") ||
        s.includes("停产") ||
        s.includes("停止生产")
      );
    }

    function isContinuing(status) {
      const s = normalize(status);

      if (isDiscontinued(s)) {
        return false;
      }

      return (
        s === "continue" ||
        s.includes("continue produksi") ||
        s.includes("lanjut produksi") ||
        s.includes("lanjut") ||
        s.includes("继续") ||
        s.includes("生产继续")
      );
    }

    function getStatusClass(status) {
      if (isDiscontinued(status)) return "disc";
      if (isContinuing(status)) return "cont";
      return "other";
    }

    /*
      Parser CSV:
      - Mendukung koma dalam kolom jika dibungkus tanda kutip
      - Mendukung tanda kutip ganda ("")
      - Mendukung line break di dalam kolom yang diapit tanda kutip
    */
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      const cleanText = text.replace(/^\uFEFF/, "");

      // Deteksi otomatis pemisah CSV: koma, titik koma, atau tab.
      // Penghitungan mengabaikan pemisah yang berada di dalam tanda kutip.
      const firstLine = cleanText.split(/\r?\n/, 1)[0] || "";
      const delimiterCounts = { ",": 0, ";": 0, "\t": 0 };
      let headerInQuotes = false;
      for (let i = 0; i < firstLine.length; i++) {
        const char = firstLine[i];
        if (char === '"') {
          if (headerInQuotes && firstLine[i + 1] === '"') i++;
          else headerInQuotes = !headerInQuotes;
        } else if (!headerInQuotes && Object.prototype.hasOwnProperty.call(delimiterCounts, char)) {
          delimiterCounts[char]++;
        }
      }
      const delimiter = Object.entries(delimiterCounts)
        .sort((a, b) => b[1] - a[1])[0][0];

      for (let i = 0; i < cleanText.length; i++) {
        const char = cleanText[i];
        const nextChar = cleanText[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === delimiter && !inQuotes) {
          row.push(field.trim());
          field = "";
          continue;
        }

        if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && nextChar === "\n") {
            i++;
          }

          row.push(field.trim());
          field = "";

          if (row.some((value) => value !== "")) {
            rows.push(row);
          }

          row = [];
          continue;
        }

        field += char;
      }

      row.push(field.trim());

      if (row.some((value) => value !== "")) {
        rows.push(row);
      }

      if (rows.length < 2) {
        showEmptyState("CSV hanya memiliki header atau tidak memiliki data.");
        return;
      }

      const supplierSet = new Set();
      const originSet = new Set();

      allData.length = 0;

      /*
        Script memakai urutan kolom:
        Kode Material, Nama Barang, Pemasok, Asal, Status, Catatan
      */
      for (let i = 1; i < rows.length; i++) {
        const rowData = rows[i];

        const record = {
          code: (rowData[0] || "").trim(),
          name: (rowData[1] || "").trim(),
          supplier: (rowData[2] || "").trim(),
          origin: (rowData[3] || "").trim(),
          status: (rowData[4] || "").trim(),
          note: (rowData[5] || "").trim()
        };

        /*
          Abaikan baris yang benar-benar kosong,
          tetapi tetap terima data jika hanya beberapa kolom kosong.
        */
        const hasContent = Object.values(record).some((value) => value !== "");

        if (!hasContent) {
          continue;
        }

        allData.push(record);

        if (record.supplier) supplierSet.add(record.supplier);
        if (record.origin) originSet.add(record.origin);
      }

      if (allData.length === 0) {
        showEmptyState("Data produk tidak ditemukan dalam CSV.");
        return;
      }

      suppliers = [...supplierSet].sort((a, b) => a.localeCompare(b));
      origins = [...originSet].sort((a, b) => a.localeCompare(b));

      renderSupplierMenu();
      renderOriginMenu();
      syncStatusSelectAll();
      applyFilters();
    }

    function createMenuItem({ labelText, className, value, id }) {
      const label = document.createElement("label");
      label.className = className;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";

      if (value !== undefined) checkbox.value = value;
      if (id) checkbox.id = id;

      const text = document.createElement("span");
      text.textContent = labelText;

      label.append(checkbox, text);
      return label;
    }

    function renderSupplierMenu() {
      const fragment = document.createDocumentFragment();

      fragment.appendChild(
        createMenuItem({
          labelText: "Pilih Semua",
          className: "dropdown-item select-all-item",
          id: "supplierSelectAll"
        })
      );

      suppliers.forEach((supplier) => {
        const item = createMenuItem({
          labelText: supplier,
          className: "dropdown-item supplier-item",
          value: supplier
        });

        const checkbox = item.querySelector("input");
        checkbox.classList.add("supplier-check");
        checkbox.checked = selected.supplier.has(supplier);

        fragment.appendChild(item);
      });

      dom.supplierMenu.replaceChildren(fragment);
      syncSupplierSelectAll();
    }

    function renderOriginMenu() {
      const fragment = document.createDocumentFragment();

      fragment.appendChild(
        createMenuItem({
          labelText: "Pilih Semua",
          className: "dropdown-item select-all-item",
          id: "originSelectAll"
        })
      );

      origins.forEach((origin) => {
        const item = createMenuItem({
          labelText: origin,
          className: "dropdown-item origin-item",
          value: origin
        });

        const checkbox = item.querySelector("input");
        checkbox.classList.add("origin-check");
        checkbox.checked = selected.origin.has(origin);

        fragment.appendChild(item);
      });

      dom.originMenu.replaceChildren(fragment);
      syncOriginSelectAll();
    }

    function syncSelectAll(menu, itemSelector, selectAllSelector) {
      const itemCheckboxes = [...menu.querySelectorAll(itemSelector)];
      const selectAll = menu.querySelector(selectAllSelector);

      if (!selectAll) return;

      const checkedCount = itemCheckboxes.filter((checkbox) => checkbox.checked).length;

      selectAll.checked =
        itemCheckboxes.length > 0 &&
        checkedCount === itemCheckboxes.length;

      selectAll.indeterminate =
        checkedCount > 0 &&
        checkedCount < itemCheckboxes.length;
    }

    function syncSupplierSelectAll() {
      syncSelectAll(
        dom.supplierMenu,
        ".supplier-check",
        "#supplierSelectAll"
      );
    }

    function syncOriginSelectAll() {
      syncSelectAll(
        dom.originMenu,
        ".origin-check",
        "#originSelectAll"
      );
    }

    function syncStatusSelectAll() {
      syncSelectAll(
        dom.statusMenu,
        ".status-check",
        "#statusSelectAll"
      );
    }

    function updateToggleText(type) {
      const selectedSet = selected[type];
      const target = dom[`${type}Text`];

      const labels = {
        supplier: "Semua Pemasok",
        origin: "Semua Asal",
        status: "Semua Status"
      };

      if (selectedSet.size === 0) {
        target.textContent = labels[type];
        return;
      }

      if (selectedSet.size === 1) {
        if (type === "status") {
          target.textContent = selectedSet.has("continue")
            ? "Lanjut Produksi"
            : "Dihentikan";
        } else {
          target.textContent = [...selectedSet][0];
        }
        return;
      }

      target.textContent = `${selectedSet.size} dipilih`;
    }

    function getFilteredData() {
      const keyword = normalize(dom.search.value);

      return allData.filter((item) => {
        const matchKeyword =
          !keyword ||
          [
            item.code,
            item.name,
            item.supplier,
            item.origin,
            item.status,
            item.note
          ].some((value) => normalize(value).includes(keyword));

        const matchSupplier =
          selected.supplier.size === 0 ||
          selected.supplier.has(item.supplier);

        const matchOrigin =
          selected.origin.size === 0 ||
          selected.origin.has(item.origin);

        let matchStatus = true;

        if (selected.status.size > 0) {
          const matchesContinue =
            selected.status.has("continue") &&
            isContinuing(item.status);

          const matchesDiscontinue =
            selected.status.has("discontinue") &&
            isDiscontinued(item.status);

          matchStatus = matchesContinue || matchesDiscontinue;
        }

        return matchKeyword && matchSupplier && matchOrigin && matchStatus;
      });
    }

    function updateStats(filteredData) {
      const total = filteredData.length;

      const continueCount = filteredData.filter((item) => {
        return isContinuing(item.status);
      }).length;

      const discontinueCount = filteredData.filter((item) => {
        return isDiscontinued(item.status);
      }).length;

      dom.totalCount.textContent = total;
      dom.continueCount.textContent = continueCount;
      dom.discontinueCount.textContent = discontinueCount;
    }

    function updateSearchIndicator() {
      const hasActiveSearch =
        dom.search.value.trim() !== "" ||
        selected.supplier.size > 0 ||
        selected.origin.size > 0 ||
        selected.status.size > 0;

      dom.searchIcon.classList.toggle("active", hasActiveSearch);
    }

    function renderTable(data) {
      if (data.length === 0) {
        dom.tableBody.innerHTML = "";
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach((item) => {
        const row = document.createElement("tr");
        const statusClass = getStatusClass(item.status);

        row.innerHTML = `
          <td><span class="material-code">${escapeHtml(item.code)}</span></td>
          <td>${escapeHtml(item.name)}</td>
          <td>${escapeHtml(item.supplier)}</td>
          <td>${escapeHtml(item.origin)}</td>
          <td>
            <span class="status-badge status-${statusClass}">
              ${escapeHtml(item.status || "-")}
            </span>
          </td>
          <td>${escapeHtml(item.note) || '<span style="color: var(--text-muted)">-</span>'}</td>
        `;

        fragment.appendChild(row);
      });

      dom.tableBody.replaceChildren(fragment);
    }

    function renderCards(data) {
      if (data.length === 0) {
        dom.cardView.innerHTML = "";
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach((item) => {
        const statusClass = getStatusClass(item.status);
        const card = document.createElement("article");

        card.className = `card ${statusClass}`;

        card.innerHTML = `
          <div class="card-code">${escapeHtml(item.code)}</div>
          <h3 class="card-name">${escapeHtml(item.name)}</h3>

          <span class="status-badge status-${statusClass}">
            ${escapeHtml(item.status || "-")}
          </span>

          <p><strong>Pemasok:</strong> ${escapeHtml(item.supplier || "-")}</p>
          <p><strong>Asal:</strong> ${escapeHtml(item.origin || "-")}</p>
          <p class="card-note">${escapeHtml(item.note) || "Tidak ada catatan"}</p>
        `;

        fragment.appendChild(card);
      });

      dom.cardView.replaceChildren(fragment);
    }

    function showEmptyState(message) {
      dom.tableBody.innerHTML = `
        <tr>
          <td class="empty-cell" colspan="6">
            <div class="empty-state">
              <strong>${escapeHtml(message)}</strong>
            </div>
          </td>
        </tr>
      `;

      dom.cardView.innerHTML = `
        <div class="empty-state" style="width: 100%;">
          <strong>${escapeHtml(message)}</strong>
        </div>
      `;

      updateStats([]);
    }

    function showNoResult() {
      dom.tableBody.innerHTML = `
        <tr>
          <td class="empty-cell" colspan="6">
            <div class="empty-state">
              <strong>Tidak ada hasil ditemukan.</strong>
              <div style="margin-top: 6px;">Ubah kata kunci atau pilihan filter Anda.</div>
            </div>
          </td>
        </tr>
      `;

      dom.cardView.innerHTML = `
        <div class="empty-state" style="width: 100%;">
          <strong>Tidak ada hasil ditemukan.</strong>
          <div style="margin-top: 6px;">Ubah kata kunci atau pilihan filter Anda.</div>
        </div>
      `;
    }

    function applyFilters() {
      const filteredData = getFilteredData();

      updateStats(filteredData);
      updateSearchIndicator();

      if (filteredData.length === 0 && allData.length > 0) {
        showNoResult();
        return;
      }

      renderTable(filteredData);
      renderCards(filteredData);
    }

    function closeAllDropdowns() {
      document.querySelectorAll(".dropdown-menu").forEach((menu) => {
        menu.classList.remove("open");
      });

      document.querySelectorAll(".dropdown-toggle").forEach((toggle) => {
        toggle.classList.remove("active");
        toggle.setAttribute("aria-expanded", "false");
      });
    }

    function setupDropdown(toggle, menu) {
      toggle.addEventListener("click", (event) => {
        event.stopPropagation();

        const isOpen = menu.classList.contains("open");

        closeAllDropdowns();

        if (!isOpen) {
          menu.classList.add("open");
          toggle.classList.add("active");
          toggle.setAttribute("aria-expanded", "true");
        }
      });

      menu.addEventListener("click", (event) => {
        event.stopPropagation();
      });
    }

    function handleSupplierFilter(event) {
      const target = event.target;

      if (target.id === "supplierSelectAll") {
        const shouldCheckAll = target.checked;
        const checkboxes = dom.supplierMenu.querySelectorAll(".supplier-check");

        selected.supplier.clear();

        checkboxes.forEach((checkbox) => {
          checkbox.checked = shouldCheckAll;

          if (shouldCheckAll) {
            selected.supplier.add(checkbox.value);
          }
        });

        syncSupplierSelectAll();
        updateToggleText("supplier");
        applyFilters();
        return;
      }

      if (target.classList.contains("supplier-check")) {
        if (target.checked) {
          selected.supplier.add(target.value);
        } else {
          selected.supplier.delete(target.value);
        }

        syncSupplierSelectAll();
        updateToggleText("supplier");
        applyFilters();
      }
    }

    function handleOriginFilter(event) {
      const target = event.target;

      if (target.id === "originSelectAll") {
        const shouldCheckAll = target.checked;
        const checkboxes = dom.originMenu.querySelectorAll(".origin-check");

        selected.origin.clear();

        checkboxes.forEach((checkbox) => {
          checkbox.checked = shouldCheckAll;

          if (shouldCheckAll) {
            selected.origin.add(checkbox.value);
          }
        });

        syncOriginSelectAll();
        updateToggleText("origin");
        applyFilters();
        return;
      }

      if (target.classList.contains("origin-check")) {
        if (target.checked) {
          selected.origin.add(target.value);
        } else {
          selected.origin.delete(target.value);
        }

        syncOriginSelectAll();
        updateToggleText("origin");
        applyFilters();
      }
    }

    function handleStatusFilter(event) {
      const target = event.target;

      if (target.id === "statusSelectAll") {
        const shouldCheckAll = target.checked;
        const checkboxes = dom.statusMenu.querySelectorAll(".status-check");

        selected.status.clear();

        checkboxes.forEach((checkbox) => {
          checkbox.checked = shouldCheckAll;

          if (shouldCheckAll) {
            selected.status.add(checkbox.value);
          }
        });

        syncStatusSelectAll();
        updateToggleText("status");
        applyFilters();
        return;
      }

      if (target.classList.contains("status-check")) {
        if (target.checked) {
          selected.status.add(target.value);
        } else {
          selected.status.delete(target.value);
        }

        syncStatusSelectAll();
        updateToggleText("status");
        applyFilters();
      }
    }

    function setView(view) {
      const tableMode = view === "table";

      dom.tableView.style.display = tableMode ? "block" : "none";
      dom.cardView.style.display = tableMode ? "none" : "flex";

      dom.btnTable.classList.toggle("active", tableMode);
      dom.btnCard.classList.toggle("active", !tableMode);

      dom.btnTable.setAttribute("aria-pressed", String(tableMode));
      dom.btnCard.setAttribute("aria-pressed", String(!tableMode));
    }

    /*
      Halaman selalu mulai dalam Light Mode.
      Tidak menggunakan localStorage atau pengaturan Dark Mode browser
      saat halaman/link pertama kali dibuka.
    */
    function initTheme() {
      const initialTheme = "light";

      document.documentElement.setAttribute("data-theme", initialTheme);
      updateThemeButton(initialTheme);
    }

    function updateThemeButton(theme) {
      const isDark = theme === "dark";

      dom.themeToggle.classList.toggle("active", isDark);
      dom.themeToggle.setAttribute("aria-pressed", String(isDark));
      dom.themeIcon.textContent = isDark ? "🌙" : "☀️";
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const nextTheme = currentTheme === "dark" ? "light" : "dark";

      document.documentElement.setAttribute("data-theme", nextTheme);
      updateThemeButton(nextTheme);
    }

    async function exportToExcel() {
      const filteredData = getFilteredData();

      if (!filteredData.length) {
        alert("Tidak ada data untuk diekspor. Ubah kata kunci atau filter terlebih dahulu.");
        return;
      }

      if (typeof ExcelJS === "undefined") {
        alert("Library Excel belum berhasil dimuat. Periksa koneksi internet lalu coba lagi.");
        return;
      }

      const workbook = new ExcelJS.Workbook();
      workbook.creator = "Advance Digitals";
      workbook.created = new Date();
      workbook.modified = new Date();
      workbook.subject = "Data produk dan status";
      workbook.company = "Advance Digitals";

      const headers = [
        "Kode Material", "Nama Barang", "Pemasok", "Asal", "Status", "Catatan"
      ];
      const toRows = (items) => items.map((item) => [
        item.code || "", item.name || "", item.supplier || "",
        item.origin || "", item.status || "", item.note || ""
      ]);

      function fitColumns(worksheet, rows, columnHeaders) {
        worksheet.columns = columnHeaders.map((header, index) => {
          const longest = Math.max(
            String(header).length,
            ...rows.map((row) => String(row[index] ?? "").length)
          );
          return { width: Math.min(Math.max(longest + 3, 14), 52) };
        });
      }

      function styleSheet(worksheet, headerRow = 1) {
        worksheet.views = [{ state: "frozen", ySplit: headerRow }];
        worksheet.getRow(headerRow).height = 26;
        worksheet.getRow(headerRow).eachCell((cell) => {
          cell.font = { bold: true, color: { argb: "FFFFFFFF" }, size: 11 };
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF087F83" } };
          cell.alignment = { vertical: "middle", horizontal: "center", wrapText: true };
          cell.border = { bottom: { style: "medium", color: { argb: "FF0B7077" } } };
        });
        worksheet.eachRow((row, rowNumber) => {
          if (rowNumber > headerRow) {
            row.alignment = { vertical: "top", wrapText: true };
            row.eachCell((cell) => {
              cell.border = { bottom: { style: "hair", color: { argb: "FFDCE5E8" } } };
            });
          }
        });
      }

      function addStatusColors(worksheet, statusColumn, firstDataRow, lastDataRow) {
        // Aturan conditional formatting Excel: warna mengikuti isi sel status.
        if (lastDataRow >= firstDataRow && typeof worksheet.addConditionalFormatting === "function") {
          const statusRange = `${worksheet.getColumn(statusColumn).letter}${firstDataRow}:${worksheet.getColumn(statusColumn).letter}${lastDataRow}`;
          worksheet.addConditionalFormatting({
            ref: statusRange,
            rules: [
              {
                type: "expression",
                formulae: [`OR(ISNUMBER(SEARCH("discontinue",${worksheet.getColumn(statusColumn).letter}${firstDataRow})),ISNUMBER(SEARCH("dihentikan",${worksheet.getColumn(statusColumn).letter}${firstDataRow})),ISNUMBER(SEARCH("stop",${worksheet.getColumn(statusColumn).letter}${firstDataRow})))`],
                style: { font: { bold: true, color: { argb: "FFA82929" } }, fill: { type: "pattern", pattern: "solid", bgColor: { argb: "FFFFEEEE" } } }
              },
              {
                type: "expression",
                formulae: [`AND(OR(ISNUMBER(SEARCH("continue",${worksheet.getColumn(statusColumn).letter}${firstDataRow})),ISNUMBER(SEARCH("lanjut",${worksheet.getColumn(statusColumn).letter}${firstDataRow}))),NOT(OR(ISNUMBER(SEARCH("discontinue",${worksheet.getColumn(statusColumn).letter}${firstDataRow})),ISNUMBER(SEARCH("dihentikan",${worksheet.getColumn(statusColumn).letter}${firstDataRow})),ISNUMBER(SEARCH("stop",${worksheet.getColumn(statusColumn).letter}${firstDataRow})))))`],
                style: { font: { bold: true, color: { argb: "FF08784F" } }, fill: { type: "pattern", pattern: "solid", bgColor: { argb: "FFE8F8EF" } } }
              }
            ]
          });
        }
        for (let row = firstDataRow; row <= lastDataRow; row++) {
          const cell = worksheet.getCell(row, statusColumn);
          const value = String(cell.value || "").toLowerCase();
          if (isContinuing(value)) {
            cell.font = { bold: true, color: { argb: "FF08784F" } };
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE8F8EF" } };
          } else if (isDiscontinued(value)) {
            cell.font = { bold: true, color: { argb: "FFA82929" } };
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFEEEE" } };
          } else {
            cell.font = { bold: true, color: { argb: "FF95630E" } };
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFF7DF" } };
          }
        }
      }

      // Sheet 1: filtered product data, formatted as a native Excel table.
      const productRows = toRows(filteredData);
      const products = workbook.addWorksheet("Data Produk", {
        properties: { tabColor: { argb: "FF087F83" } }
      });
      products.addTable({
        name: "TabelDataProduk",
        ref: "A1",
        headerRow: true,
        totalsRow: false,
        style: { theme: "TableStyleMedium2", showRowStripes: true },
        columns: headers.map((name) => ({ name, filterButton: true })),
        rows: productRows
      });
      fitColumns(products, productRows, headers);
      styleSheet(products);
      addStatusColors(products, 5, 2, productRows.length + 1);
      products.autoFilter = { from: "A1", to: `F${productRows.length + 1}` };

      // Sheet 2: overall summary based on the complete dataset.
      const summary = workbook.addWorksheet("Ringkasan", {
        properties: { tabColor: { argb: "FF2563EB" } }
      });
      const total = allData.length;
      const continued = allData.filter((item) => isContinuing(item.status)).length;
      const stopped = allData.filter((item) => isDiscontinued(item.status)).length;
      const other = total - continued - stopped;
      const summaryRows = [
        ["Total Produk", total],
        ["Lanjut Produksi", continued],
        ["Dihentikan", stopped],
        ["Status Lainnya", other],
        ["Diekspor (sesuai filter)", filteredData.length],
        ["Tanggal Ekspor", new Date().toLocaleString("id-ID")]
      ];
      summary.addTable({
        name: "TabelRingkasan",
        ref: "A1",
        headerRow: true,
        style: { theme: "TableStyleMedium2", showRowStripes: true },
        columns: [{ name: "Keterangan" }, { name: "Jumlah / Nilai" }],
        rows: summaryRows
      });
      fitColumns(summary, summaryRows, ["Keterangan", "Jumlah / Nilai"]);
      styleSheet(summary);

      // Sheet 3: supplier summary based on the complete dataset.
      const supplierMap = new Map();
      allData.forEach((item) => {
        const name = item.supplier || "Tidak diketahui";
        if (!supplierMap.has(name)) supplierMap.set(name, { total: 0, continued: 0, stopped: 0 });
        const entry = supplierMap.get(name);
        entry.total++;
        if (isContinuing(item.status)) entry.continued++;
        if (isDiscontinued(item.status)) entry.stopped++;
      });
      const supplierHeaders = ["Pemasok", "Total Produk", "Lanjut Produksi", "Dihentikan"];
      const supplierRows = [...supplierMap.entries()]
        .sort((a, b) => b[1].total - a[1].total)
        .map(([name, value]) => [name, value.total, value.continued, value.stopped]);
      const supplierSheet = workbook.addWorksheet("Pemasok", {
        properties: { tabColor: { argb: "FF7C3AED" } }
      });
      supplierSheet.addTable({
        name: "TabelPemasok",
        ref: "A1",
        headerRow: true,
        style: { theme: "TableStyleMedium4", showRowStripes: true },
        columns: supplierHeaders.map((name) => ({ name, filterButton: true })),
        rows: supplierRows
      });
      fitColumns(supplierSheet, supplierRows, supplierHeaders);
      styleSheet(supplierSheet);

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const today = new Date().toLocaleDateString("id-ID").replace(/\//g, "-");
      link.href = url;
      link.download = `Product_Advance_${today}.xlsx`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function loadData() {
      dom.tableBody.innerHTML = `
        <tr>
          <td class="empty-cell" colspan="6">
            <div class="loading">
              <div class="loading-spinner"></div>
              <div>Memuat data...</div>
            </div>
          </td>
        </tr>
      `;

      try {
        /*
          cache: "no-store" membantu GitHub Pages mengambil CSV terbaru,
          bukan isi cache browser yang lama.
        */
        const response = await fetch(CSV_PATH, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`CSV tidak ditemukan. HTTP ${response.status}`);
        }

        const text = await response.text();

        if (!text || !text.trim()) {
          throw new Error("Isi file data.csv kosong.");
        }

        console.log(`CSV berhasil dimuat dari: ${CSV_PATH}`);
        parseCSV(text);

      } catch (error) {
        console.error("Gagal memuat CSV:", error);

        dom.tableBody.innerHTML = `
          <tr>
            <td class="empty-cell" colspan="6">
              <div class="error-state">
                <strong>Gagal memuat data.csv</strong>
                <div style="margin-top: 7px; font-size: 12px;">
                  Periksa nama file, huruf besar/kecil, folder file CSV, dan pengaturan GitHub Pages.
                </div>
                <div style="margin-top: 5px; font-size: 11px; opacity: 0.8;">
                  ${escapeHtml(error.message)}
                </div>
              </div>
            </td>
          </tr>
        `;
      }
    }

    function debounce(callback, delay = 120) {
      let timer;

      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => callback(...args), delay);
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      initDomCache();
      initTheme();

      setupDropdown(dom.supplierToggle, dom.supplierMenu);
      setupDropdown(dom.originToggle, dom.originMenu);
      setupDropdown(dom.statusToggle, dom.statusMenu);

      document.addEventListener("click", closeAllDropdowns);

      dom.supplierMenu.addEventListener("change", handleSupplierFilter);
      dom.originMenu.addEventListener("change", handleOriginFilter);
      dom.statusMenu.addEventListener("change", handleStatusFilter);

      const searchDebounced = debounce(applyFilters, 120);

      dom.search.addEventListener("input", searchDebounced);

      dom.search.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          applyFilters();
        }
      });

      dom.btnSearch.addEventListener("click", applyFilters);
      dom.btnExport.addEventListener("click", exportToExcel);

      dom.dashboardToggle.addEventListener("click", () => {
        const willOpen = dom.dashboardStats.hidden;
        dom.dashboardStats.hidden = !willOpen;
        dom.dashboardToggle.setAttribute("aria-expanded", String(willOpen));
        dom.dashboardToggle.textContent = willOpen ? "✕ Tutup Dashboard" : "📊 Dashboard";
      });

      dom.btnTable.addEventListener("click", () => setView("table"));
      dom.btnCard.addEventListener("click", () => setView("card"));

      dom.themeToggle.addEventListener("click", toggleTheme);

      loadData();
    });
  </script>
</body>
