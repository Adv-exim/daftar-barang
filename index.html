<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advance Digitals — Product & Status</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #4f6d7a;
      --primary-soft: #eef3f5;
      --primary-dark: #3d5762;

      --accent-gradient: linear-gradient(135deg, #5b7c8a, #43606c);

      --table-header-bg: #f1f5f7;
      --table-header-text: #334752;
      --table-header-border: #d8e2e7;

      --bg: #f7f9fa;
      --bg-gradient: linear-gradient(180deg, #f9fbfc 0%, #f2f6f8 100%);

      --card-bg: #ffffff;
      --card-bg-hover: #f7fafb;
      --border: #e2e9ed;
      --text: #2f3e46;
      --text-light: #5d6f78;
      --text-muted: #8b9aa2;

      --shadow-sm: 0 1px 3px rgba(47, 62, 70, .06);
      --shadow-md: 0 6px 18px rgba(47, 62, 70, .07);
      --shadow-lg: 0 14px 30px rgba(47, 62, 70, .10);

      --radius: 14px;
      --radius-sm: 10px;

      --status-disc-bg: #fdf2f3;
      --status-disc-text: #a5545f;
      --status-disc-border: #f2d7db;

      --status-cont-bg: #eff7f2;
      --status-cont-text: #4b7a63;
      --status-cont-border: #d3e7dc;

      --status-other-bg: #fbf6ec;
      --status-other-text: #8a7040;
      --status-other-border: #eddfc4;
    }

    [data-theme="dark"] {
      --primary: #8fb0bd;
      --primary-soft: rgba(143, 176, 189, .12);
      --primary-dark: #a8c5d0;

      --accent-gradient: linear-gradient(135deg, #4a6472, #33474f);

      --table-header-bg: #22303a;
      --table-header-text: #dbe6ea;
      --table-header-border: #31424d;

      --bg: #101820;
      --bg-gradient: linear-gradient(180deg, #101820 0%, #151f27 100%);

      --card-bg: #17222b;
      --card-bg-hover: #1d2b36;
      --border: #2b3b46;
      --text: #e5edf1;
      --text-light: #b3c2ca;
      --text-muted: #8496a0;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .30);
      --shadow-md: 0 6px 18px rgba(0, 0, 0, .32);
      --shadow-lg: 0 14px 30px rgba(0, 0, 0, .40);

      --status-disc-bg: rgba(214, 116, 130, .12);
      --status-disc-text: #e8b3ba;
      --status-disc-border: rgba(232, 179, 186, .28);

      --status-cont-bg: rgba(112, 168, 140, .12);
      --status-cont-text: #b4d6c4;
      --status-cont-border: rgba(180, 214, 196, .28);

      --status-other-bg: rgba(196, 164, 103, .12);
      --status-other-text: #e2cfa4;
      --status-other-border: rgba(226, 207, 164, .28);
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      max-width: 1500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px;
      background: var(--bg-gradient);
      color: var(--text);
      font-family: "Segoe UI", Inter, Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      transition: background .25s ease, color .25s ease;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .hidden { display: none !important; }

    /* HEADER HALAMAN */
    .header-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px 22px;
      margin-bottom: 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
    }

    .header-title h1 {
      margin: 0 0 4px;
      font-size: clamp(22px, 3vw, 27px);
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--primary-dark);
    }

    .header-title p {
      margin: 0;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 650;
    }

    .header-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-item {
      min-width: 82px;
      padding: 9px 13px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg-hover);
    }

    .stat-value {
      color: var(--text);
      font-size: 18px;
      font-weight: 800;
      line-height: 1.15;
    }

    .stat-label {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .theme-toggle {
      position: relative;
      width: 62px;
      height: 31px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card-bg-hover);
      transition: all .25s ease;
    }

    .theme-toggle.active {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .theme-toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--shadow-sm);
      transition: transform .28s cubic-bezier(.34, 1.56, .64, 1);
    }

    [data-theme="dark"] .theme-toggle-slider { background: #22303a; }

    .theme-toggle.active .theme-toggle-slider { transform: translateX(31px); }

    /* TOOLBAR */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-wrapper input {
      width: 100%;
      height: 45px;
      padding: 10px 16px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
      transition: all .2s ease;
    }

    .search-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 45px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      transition: all .2s ease;
    }

    .btn:hover {
      border-color: var(--primary);
      background: var(--card-bg-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary {
      color: #fff !important;
      border-color: transparent;
      background: var(--accent-gradient);
    }

    .btn-primary:hover { filter: brightness(1.05); }

    .view-buttons { display: flex; gap: 8px; }

    .view-buttons button {
      min-height: 45px;
      padding: 0 18px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      font-size: 13px;
      font-weight: 700;
    }

    .view-buttons button.active {
      color: #fff !important;
      border-color: transparent;
      background: var(--accent-gradient);
    }

    /* TABLE */
    .table-container {
      max-height: 74vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      box-shadow: var(--shadow-md);
    }

    table {
      width: 100%;
      min-width: 950px;
      border-spacing: 0;
      border-collapse: separate;
      background: var(--card-bg);
    }

    /* HEADER TABEL TETAP SAAT SCROLL */
    th {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 0;
      color: var(--table-header-text);
      background: var(--table-header-bg);
      border-bottom: 1px solid var(--table-header-border);
      font-size: 12px;
      font-weight: 800;
      text-align: left;
      white-space: nowrap;
    }

    th .th-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
    }

    .column-filter-btn {
      display: inline-grid;
      place-items: center;
      width: 27px;
      height: 27px;
      color: var(--text-light);
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--card-bg);
      font-size: 12px;
      transition: all .18s ease;
    }

    .column-filter-btn:hover,
    .column-filter-btn.active {
      color: var(--primary-dark);
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .column-filter-btn.has-filter {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    td {
      padding: 12px 14px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 13px;
      vertical-align: middle;
      overflow-wrap: anywhere;
    }

    tbody tr:hover td { background: var(--card-bg-hover); }
    tbody tr:last-child td { border-bottom: none; }

    .material-code {
      color: var(--primary-dark);
      font-weight: 800;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-disc {
      color: var(--status-disc-text);
      border-color: var(--status-disc-border);
      background: var(--status-disc-bg);
    }

    .status-cont {
      color: var(--status-cont-text);
      border-color: var(--status-cont-border);
      background: var(--status-cont-bg);
    }

    .status-other {
      color: var(--status-other-text);
      border-color: var(--status-other-border);
      background: var(--status-other-bg);
    }

    /* FILTER KOLOM */
    .filter-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 8px;
      z-index: 1000;
      display: none;
      width: min(320px, calc(100vw - 40px));
      padding: 12px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      box-shadow: var(--shadow-lg);
    }

    .filter-popover.open { display: block; }

    .filter-search {
      width: 100%;
      height: 38px;
      margin-bottom: 10px;
      padding: 8px 12px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--card-bg-hover);
    }

    .filter-search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .filter-options {
      max-height: 230px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card-bg);
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 11px;
      color: var(--text);
      cursor: pointer;
      font-size: 12.5px;
      border-bottom: 1px solid var(--border);
    }

    .filter-option:last-child { border-bottom: none; }
    .filter-option:hover { background: var(--card-bg-hover); }
    .filter-option span { overflow-wrap: anywhere; }

    .filter-option input {
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--primary);
    }

    .filter-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .filter-actions button {
      flex: 1;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg-hover);
      color: var(--text);
      font-size: 12px;
      font-weight: 750;
    }

    .filter-actions .apply {
      color: #fff;
      border-color: transparent;
      background: var(--accent-gradient);
    }

    .empty-cell { padding: 0 !important; }

    .empty-state, .loading, .error-state {
      padding: 56px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-state strong, .error-state strong { color: var(--text); }
    .error-state { color: #b4595f; }

    .loading-spinner {
      display: inline-block;
      width: 26px;
      height: 26px;
      margin-bottom: 10px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* CARD VIEW */
    .card-mode {
      display: none;
      flex-wrap: wrap;
      gap: 14px;
    }

    .card-mode.active { display: flex; }

    .card {
      position: relative;
      flex: 1 1 300px;
      min-width: 280px;
      max-width: calc(33.333% - 10px);
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      box-shadow: var(--shadow-md);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .card::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      border-radius: 4px 0 0 4px;
      content: "";
    }

    .card.disc::before { background: #c98a93; }
    .card.cont::before { background: #7fa892; }
    .card.other::before { background: #c7ab74; }

    .card-code {
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .card-name {
      margin: 0 0 10px;
      font-size: 14.5px;
      font-weight: 800;
      word-break: break-word;
    }

    .card p { margin: 5px 0; color: var(--text-light); font-size: 12px; }
    .card p strong { color: var(--text); }

    .card-note {
      margin-top: 10px !important;
      padding-top: 9px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 1050px) {
      .card { max-width: calc(50% - 7px); }
    }

    @media (max-width: 760px) {
      body { padding: 14px; }

      .header-section,
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .header-right { justify-content: flex-start; }
      .btn, .view-buttons button { width: 100%; }
      .view-buttons { flex-direction: column; }
      .card { max-width: 100%; }
      .filter-popover { left: 4px; }
    }

    @media (max-width: 460px) {
      .stats-bar { width: 100%; }
      .stat-item { flex: 1; }
    }
  </style>
</head>

<body>
  <header class="header-section">
    <div class="header-title">
      <h1>Advance Digitals</h1>
      <p>Product and Status Dashboard</p>
    </div>

    <div class="header-right">
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-value" id="totalCount">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="continueCount">0</div>
          <div class="stat-label">Lanjut</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="discontinueCount">0</div>
          <div class="stat-label">Stop</div>
        </div>
      </div>

      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Ubah mode terang atau gelap">
        <span class="theme-toggle-slider" id="themeIcon">☀️</span>
      </button>
    </div>
  </header>

  <section class="toolbar">
    <div class="search-wrapper">
      <input
        id="search"
        type="search"
        placeholder="Cari kode, nama barang, pemasok, asal, status, atau catatan..."
        autocomplete="off"
      />
    </div>

    <div class="view-buttons">
      <button id="btnTable" class="active" type="button">Tabel</button>
      <button id="btnCard" type="button">Kartu</button>
    </div>

    <button class="btn btn-primary" id="btnExport" type="button">⬇️ Ekspor Excel</button>
  </section>

  <section id="tableView" class="table-container">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </section>

  <section id="cardView" class="card-mode"></section>

  <script>
    const CSVPATH = "./data.csv";

    const COLUMNS = [
      { key: "code", label: "Kode Material" },
      { key: "name", label: "Nama Barang" },
      { key: "supplier", label: "Pemasok" },
      { key: "origin", label: "Asal" },
      { key: "status", label: "Status" },
      { key: "note", label: "Catatan" }
    ];

    const allData = [];
    const columnValues = {};
    const columnSelections = {};
    const columnSearches = {};

    const dom = {};

    function initDomCache() {
      [
        "search", "btnExport", "tableHead", "tableBody",
        "tableView", "cardView", "btnTable", "btnCard",
        "totalCount", "continueCount", "discontinueCount",
        "themeToggle", "themeIcon"
      ].forEach(id => dom[id] = document.getElementById(id));
    }

    function escapeHtml(value) {
      const el = document.createElement("div");
      el.textContent = String(value ?? "");
      return el.innerHTML;
    }

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    function isDiscontinued(status) {
      const s = normalize(status);
      return s.includes("discontinue") ||
             s.includes("dihentikan") ||
             s.includes("stop") ||
             s.includes("berhenti");
    }

    function isContinuing(status) {
      const s = normalize(status);
      if (isDiscontinued(s)) return false;
      return s.includes("continue") ||
             s.includes("lanjut produksi") ||
             s.includes("lanjut");
    }

    function getStatusClass(status) {
      if (isDiscontinued(status)) return "disc";
      if (isContinuing(status)) return "cont";
      return "other";
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      const cleanText = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

      for (let i = 0; i < cleanText.length; i++) {
        const char = cleanText[i];
        const nextChar = cleanText[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === "," && !inQuotes) {
          row.push(field.trim());
          field = "";
          continue;
        }

        if (char === "\n" && !inQuotes) {
          row.push(field.trim());
          if (row.some(value => value !== "")) rows.push(row);
          row = [];
          field = "";
          continue;
        }

        field += char;
      }

      row.push(field.trim());
      if (row.some(value => value !== "")) rows.push(row);

      return rows;
    }

    function loadDataFromCSV(text) {
      const rows = parseCSV(text);

      if (rows.length < 2) {
        showEmptyState("CSV hanya memiliki header atau tidak memiliki data.");
        return;
      }

      allData.length = 0;

      COLUMNS.forEach(column => {
        columnValues[column.key] = new Set();
        columnSelections[column.key] = new Set();
        columnSearches[column.key] = "";
      });

      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const record = {
          code: (r[0] || "").trim(),
          name: (r[1] || "").trim(),
          supplier: (r[2] || "").trim(),
          origin: (r[3] || "").trim(),
          status: (r[4] || "").trim(),
          note: (r[5] || "").trim()
        };

        if (!Object.values(record).some(value => value !== "")) continue;

        allData.push(record);

        COLUMNS.forEach(column => {
          const value = record[column.key];
          if (value !== "") columnValues[column.key].add(value);
        });
      }

      if (!allData.length) {
        showEmptyState("Data produk tidak ditemukan dalam CSV.");
        return;
      }

      renderTableHead();
      applyFilters();
    }

    function renderTableHead() {
      const fragment = document.createDocumentFragment();
      const tr = document.createElement("tr");

      COLUMNS.forEach(column => {
        const th = document.createElement("th");
        th.style.position = "relative";

        th.innerHTML = `
          <div class="th-inner">
            <span>${escapeHtml(column.label)}</span>
            <button
              class="column-filter-btn"
              type="button"
              data-column="${column.key}"
              title="Filter ${escapeHtml(column.label)}"
            >▾</button>
          </div>
          <div class="filter-popover" data-popover="${column.key}"></div>
        `;

        fragment.appendChild(th);
      });

      dom.tableHead.replaceChildren(fragment);

      dom.tableHead.querySelectorAll(".column-filter-btn").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          toggleColumnFilter(button.dataset.column, button);
        });
      });
    }

    function toggleColumnFilter(columnKey, button) {
      const popover = dom.tableHead.querySelector(`[data-popover="${columnKey}"]`);
      const isOpen = popover.classList.contains("open");

      closeAllColumnFilters();

      if (isOpen) return;

      renderColumnFilter(columnKey, popover);
      popover.classList.add("open");
      button.classList.add("active");
    }

    function closeAllColumnFilters() {
      dom.tableHead.querySelectorAll(".filter-popover").forEach(popover => {
        popover.classList.remove("open");
        popover.innerHTML = "";
      });

      dom.tableHead.querySelectorAll(".column-filter-btn").forEach(button => {
        button.classList.remove("active");
      });
    }

    function renderColumnFilter(columnKey, popover) {
      const searchTerm = normalize(columnSearches[columnKey]);
      const values = [...columnValues[columnKey]]
        .sort((a, b) => a.localeCompare(b))
        .filter(value => !searchTerm || normalize(value).includes(searchTerm));

      const selectedSet = columnSelections[columnKey];

      popover.innerHTML = `
        <input
          class="filter-search"
          type="search"
          placeholder="Cari nilai..."
          value="${escapeHtml(columnSearches[columnKey])}"
        />
        <div class="filter-options">
          ${
            values.length
              ? values.map(value => `
                  <label class="filter-option">
                    <input
                      type="checkbox"
                      value="${escapeHtml(value)}"
                      ${selectedSet.has(value) ? "checked" : ""}
                    />
                    <span>${escapeHtml(value || "(Kosong)")}</span>
                  </label>
                `).join("")
              : `<div class="filter-option"><span>Tidak ada nilai.</span></div>`
          }
        </div>
        <div class="filter-actions">
          <button type="button" class="clear">Bersihkan</button>
          <button type="button" class="apply">Terapkan</button>
        </div>
      `;

      const searchInput = popover.querySelector(".filter-search");
      const optionsBox = popover.querySelector(".filter-options");

      searchInput.addEventListener("input", () => {
        columnSearches[columnKey] = searchInput.value;
        renderColumnFilter(columnKey, popover);
        popover.classList.add("open");

        const newSearchInput = popover.querySelector(".filter-search");
        newSearchInput.focus();
        newSearchInput.setSelectionRange(
          newSearchInput.value.length,
          newSearchInput.value.length
        );
      });

      optionsBox.addEventListener("change", event => {
        const checkbox = event.target;

        if (checkbox.type !== "checkbox") return;

        checkbox.checked
          ? selectedSet.add(checkbox.value)
          : selectedSet.delete(checkbox.value);
      });

      popover.querySelector(".clear").addEventListener("click", () => {
        selectedSet.clear();
        columnSearches[columnKey] = "";
        renderColumnFilter(columnKey, popover);
        popover.classList.add("open");
        updateFilterButtonState(columnKey);
        applyFilters();
      });

      popover.querySelector(".apply").addEventListener("click", () => {
        updateFilterButtonState(columnKey);
        closeAllColumnFilters();
        applyFilters();
      });

      popover.addEventListener("click", event => event.stopPropagation());
    }

    function updateFilterButtonState(columnKey) {
      const button = dom.tableHead.querySelector(`[data-column="${columnKey}"]`);
      button.classList.toggle("has-filter", columnSelections[columnKey].size > 0);
    }

    function getFilteredData() {
      const keyword = normalize(dom.search.value);

      return allData.filter(item => {
        const matchKeyword = !keyword || COLUMNS.some(column =>
          normalize(item[column.key]).includes(keyword)
        );

        const matchColumns = COLUMNS.every(column => {
          const selectedSet = columnSelections[column.key];
          if (selectedSet.size === 0) return true;
          return selectedSet.has(item[column.key]);
        });

        return matchKeyword && matchColumns;
      });
    }

    function updateStats(filteredData) {
      dom.totalCount.textContent = filteredData.length;
      dom.continueCount.textContent = filteredData.filter(item => isContinuing(item.status)).length;
      dom.discontinueCount.textContent = filteredData.filter(item => isDiscontinued(item.status)).length;
    }

    function renderTable(data) {
      if (!data.length) {
        dom.tableBody.innerHTML = "";
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach(item => {
        const row = document.createElement("tr");
        const statusClass = getStatusClass(item.status);

        row.innerHTML = `
          <td><span class="material-code">${escapeHtml(item.code)}</span></td>
          <td>${escapeHtml(item.name)}</td>
          <td>${escapeHtml(item.supplier)}</td>
          <td>${escapeHtml(item.origin)}</td>
          <td>
            <span class="status-badge status-${statusClass}">
              ${escapeHtml(item.status || "-")}
            </span>
          </td>
          <td>${escapeHtml(item.note || "-")}</td>
        `;

        fragment.appendChild(row);
      });

      dom.tableBody.replaceChildren(fragment);
    }

    function renderCards(data) {
      if (!data.length) {
        dom.cardView.innerHTML = "";
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach(item => {
        const statusClass = getStatusClass(item.status);
        const card = document.createElement("article");
        card.className = `card ${statusClass}`;

        card.innerHTML = `
          <div class="card-code">${escapeHtml(item.code)}</div>
          <h3 class="card-name">${escapeHtml(item.name)}</h3>
          <span class="status-badge status-${statusClass}">
            ${escapeHtml(item.status || "-")}
          </span>
          <p><strong>Pemasok:</strong> ${escapeHtml(item.supplier || "-")}</p>
          <p><strong>Asal:</strong> ${escapeHtml(item.origin || "-")}</p>
          <p class="card-note">${escapeHtml(item.note || "Tidak ada catatan")}</p>
        `;

        fragment.appendChild(card);
      });

      dom.cardView.replaceChildren(fragment);
    }

    function showEmptyState(message) {
      dom.tableBody.innerHTML = `
        <tr>
          <td class="empty-cell" colspan="6">
            <div class="empty-state"><strong>${escapeHtml(message)}</strong></div>
          </td>
        </tr>
      `;

      dom.cardView.innerHTML = `
        <div class="empty-state" style="width:100%">
          <strong>${escapeHtml(message)}</strong>
        </div>
      `;

      updateStats([]);
    }

    function showNoResult() {
      dom.tableBody.innerHTML = `
        <tr>
          <td class="empty-cell" colspan="6">
            <div class="empty-state">
              <strong>Tidak ada hasil ditemukan.</strong>
              <div style="margin-top:6px">Ubah kata kunci atau filter kolom.</div>
            </div>
          </td>
        </tr>
      `;

      dom.cardView.innerHTML = `
        <div class="empty-state" style="width:100%">
          <strong>Tidak ada hasil ditemukan.</strong>
          <div style="margin-top:6px">Ubah kata kunci atau filter kolom.</div>
        </div>
      `;
    }

    function applyFilters() {
      const filteredData = getFilteredData();
      updateStats(filteredData);

      if (!filteredData.length) {
        showNoResult();
        return;
      }

      renderTable(filteredData);
      renderCards(filteredData);
    }

    function setView(view) {
      const tableMode = view === "table";

      dom.tableView.style.display = tableMode ? "block" : "none";
      dom.cardView.classList.toggle("active", !tableMode);

      dom.btnTable.classList.toggle("active", tableMode);
      dom.btnCard.classList.toggle("active", !tableMode);
    }

    function initTheme() {
      document.documentElement.setAttribute("data-theme", "light");
      updateThemeButton("light");
    }

    function updateThemeButton(theme) {
      const isDark = theme === "dark";
      dom.themeToggle.classList.toggle("active", isDark);
      dom.themeToggle.setAttribute("aria-pressed", String(isDark));
      dom.themeIcon.textContent = isDark ? "🌙" : "☀️";
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const nextTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nextTheme);
      updateThemeButton(nextTheme);
    }

    /* EXPORT EXCEL */
    function autoFitColumns(rows) {
      const widths = [];

      rows.forEach(row => {
        row.forEach((cell, colIndex) => {
          const length = Math.max(String(cell ?? "").length, 10);
          widths[colIndex] = Math.max(widths[colIndex] || 10, Math.min(length + 3, 60));
        });
      });

      return widths.map(width => ({ wch: width }));
    }

    function exportToExcel() {
      const filteredData = getFilteredData();

      if (!filteredData.length) {
        alert("Tidak ada data untuk diekspor.");
        return;
      }

      const headers = COLUMNS.map(column => column.label);

      const productRows = [
        headers,
        ...filteredData.map(item => COLUMNS.map(column => item[column.key]))
      ];

      const continueCount = filteredData.filter(item => isContinuing(item.status)).length;
      const discontinueCount = filteredData.filter(item => isDiscontinued(item.status)).length;
      const otherCount = filteredData.length - continueCount - discontinueCount;

      const summaryRows = [
        ["Ringkasan Produk", ""],
        ["Total Produk", filteredData.length],
        ["Lanjut Produksi", continueCount],
        ["Dihentikan", discontinueCount],
        ["Status Lain", otherCount],
        ["", ""],
        ["Tanggal Ekspor", new Date().toLocaleString("id-ID")]
      ];

      const workbook = XLSX.utils.book_new();

      const productSheet = XLSX.utils.aoa_to_sheet(productRows);
      productSheet["!cols"] = autoFitColumns(productRows);
      productSheet["!autofilter"] = {
        ref: XLSX.utils.encode_range({
          s: { r: 0, c: 0 },
          e: { r: productRows.length - 1, c: headers.length - 1 }
        })
      };
      productSheet["!freeze"] = { xSplit: 0, ySplit: 1 };

      const summarySheet = XLSX.utils.aoa_to_sheet(summaryRows);
      summarySheet["!cols"] = autoFitColumns(summaryRows);

      XLSX.utils.book_append_sheet(workbook, productSheet, "Data Produk");
      XLSX.utils.book_append_sheet(workbook, summarySheet, "Ringkasan");

      const lastRow = productRows.length - 1;
      const statusRange = `E2:E${lastRow + 1}`;

      productSheet["!conditionalFormats"] = [
        {
          ref: statusRange,
          rules: [{
            type: "containsText",
            operator: "containsText",
            text: "DISCONTINUE",
            style: {
              fill: { fgColor: { rgb: "FDECEEF0" } },
              font: { color: { rgb: "A5545F" }, bold: true }
            }
          }]
        },
        {
          ref: statusRange,
          rules: [{
            type: "containsText",
            operator: "containsText",
            text: "DIHENTIKAN",
            style: {
              fill: { fgColor: { rgb: "FDECEEF0" } },
              font: { color: { rgb: "A5545F" }, bold: true }
            }
          }]
        },
        {
          ref: statusRange,
          rules: [{
            type: "containsText",
            operator: "containsText",
            text: "STOP",
            style: {
              fill: { fgColor: { rgb: "FBF6EC" } },
              font: { color: { rgb: "8A7040" }, bold: true }
            }
          }]
        },
        {
          ref: statusRange,
          rules: [{
            type: "containsText",
            operator: "containsText",
            text: "CONTINUE",
            style: {
              fill: { fgColor: { rgb: "EFF7F2" } },
              font: { color: { rgb: "4B7A63" }, bold: true }
            }
          }]
        },
        {
          ref: statusRange,
          rules: [{
            type: "containsText",
            operator: "containsText",
            text: "LANJUT",
            style: {
              fill: { fgColor: { rgb: "EFF7F2" } },
              font: { color: { rgb: "4B7A63" }, bold: true }
            }
          }]
        }
      ];

      const today = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `Advance-Digitals-Product-${today}.xlsx`);
    }

    async function loadData() {
      dom.tableBody.innerHTML = `
        <tr>
          <td class="empty-cell" colspan="6">
            <div class="loading">
              <div class="loading-spinner"></div>
              <div>Memuat data...</div>
            </div>
          </td>
        </tr>
      `;

      try {
        const response = await fetch(CSVPATH, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`CSV tidak ditemukan. HTTP ${response.status}`);
        }

        const text = await response.text();

        if (!text || !text.trim()) {
          throw new Error("Isi file data.csv kosong.");
        }

        loadDataFromCSV(text);
      } catch (error) {
        console.error("Gagal memuat CSV:", error);

        dom.tableBody.innerHTML = `
          <tr>
            <td class="empty-cell" colspan="6">
              <div class="error-state">
                <strong>Gagal memuat data.csv</strong>
                <div style="margin-top:7px;font-size:12px">
                  Pastikan file bernama <strong>data.csv</strong> berada di folder yang sama dengan <strong>index.html</strong>.
                </div>
                <div style="margin-top:5px;font-size:11px;opacity:.8">
                  ${escapeHtml(error.message)}
                </div>
              </div>
            </td>
          </tr>
        `;
      }
    }

    function debounce(callback, delay = 120) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => callback(...args), delay);
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      initDomCache();
      initTheme();

      document.addEventListener("click", closeAllColumnFilters);

      const searchDebounced = debounce(applyFilters, 120);
      dom.search.addEventListener("input", searchDebounced);

      dom.search.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          applyFilters();
        }
      });

      dom.btnExport.addEventListener("click", exportToExcel);

      dom.btnTable.addEventListener("click", () => setView("table"));
      dom.btnCard.addEventListener("click", () => setView("card"));

      dom.themeToggle.addEventListener("click", toggleTheme);

      loadData();
    });
  </script>
</body>
</html>
