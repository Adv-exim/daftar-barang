<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advance Digitals — Product & Status</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #4f6d7a;
      --primary-soft: #eef3f5;
      --primary-dark: #3d5762;

      --accent-gradient: linear-gradient(135deg, #5b7c8a, #43606c);

      /* Warna judul halaman */
      --page-header-bg: linear-gradient(120deg, #4f6d7a, #6b8f9c 55%, #7fa3ad);
      --page-header-text: #ffffff;
      --page-header-subtext: rgba(255, 255, 255, .82);

      /* Warna header tabel */
      --table-header-bg: #dcebe9;
      --table-header-text: #2f4f4f;
      --table-header-border: #c3d8d5;

      --bg: #f7f9fa;
      --bg-gradient: linear-gradient(180deg, #f9fbfc 0%, #f2f6f8 100%);

      --card-bg: #ffffff;
      --card-bg-hover: #f7fafb;
      --border: #e2e9ed;
      --text: #2f3e46;
      --text-light: #5d6f78;
      --text-muted: #8b9aa2;

      --shadow-sm: 0 1px 3px rgba(47, 62, 70, .06);
      --shadow-md: 0 6px 18px rgba(47, 62, 70, .07);
      --shadow-lg: 0 14px 30px rgba(47, 62, 70, .10);

      --radius: 14px;
      --radius-sm: 10px;

      --status-disc-bg: #fdf2f3;
      --status-disc-text: #a5545f;
      --status-disc-border: #f2d7db;

      --status-cont-bg: #eff7f2;
      --status-cont-text: #4b7a63;
      --status-cont-border: #d3e7dc;

      --status-other-bg: #fbf6ec;
      --status-other-text: #8a7040;
      --status-other-border: #eddfc4;
    }

    [data-theme="dark"] {
      --primary: #8fb0bd;
      --primary-soft: rgba(143, 176, 189, .12);
      --primary-dark: #a8c5d0;

      --accent-gradient: linear-gradient(135deg, #4a6472, #33474f);

      --page-header-bg: linear-gradient(120deg, #22303a, #2c414b 55%, #35505a);
      --page-header-text: #eaf3f5;
      --page-header-subtext: rgba(234, 243, 245, .78);

      --table-header-bg: #243c3c;
      --table-header-text: #d8ece9;
      --table-header-border: #34504e;

      --bg: #101820;
      --bg-gradient: linear-gradient(180deg, #101820 0%, #151f27 100%);

      --card-bg: #17222b;
      --card-bg-hover: #1d2b36;
      --border: #2b3b46;
      --text: #e5edf1;
      --text-light: #b3c2ca;
      --text-muted: #8496a0;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .30);
      --shadow-md: 0 6px 18px rgba(0, 0, 0, .32);
      --shadow-lg: 0 14px 30px rgba(0, 0, 0, .40);

      --status-disc-bg: rgba(214, 116, 130, .12);
      --status-disc-text: #e8b3ba;
      --status-disc-border: rgba(232, 179, 186, .28);

      --status-cont-bg: rgba(112, 168, 140, .12);
      --status-cont-text: #b4d6c4;
      --status-cont-border: rgba(180, 214, 196, .28);

      --status-other-bg: rgba(196, 164, 103, .12);
      --status-other-text: #e2cfa4;
      --status-other-border: rgba(226, 207, 164, .28);
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      max-width: 1500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px;
      background: var(--bg-gradient);
      color: var(--text);
      font-family: "Segoe UI", Inter, Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      transition: background .25s ease, color .25s ease;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    /* HEADER HALAMAN — JUDUL BERWARNA */
    .header-section {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 22px;
      margin-bottom: 18px;
      color: var(--page-header-text);
      background: var(--page-header-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
    }

    .header-section::after {
      content: "";
      position: absolute;
      right: -70px;
      top: -90px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
    }

    .header-title {
      position: relative;
      z-index: 1;
    }

    .header-title h1 {
      margin: 0 0 5px;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 900;
      letter-spacing: -.02em;
      color: var(--page-header-text);
    }

    .header-title p {
      margin: 0;
      color: var(--page-header-subtext);
      font-size: 12px;
      font-weight: 650;
    }

    .header-right {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-item {
      min-width: 82px;
      padding: 9px 13px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 12px;
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(8px);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 850;
      line-height: 1.15;
    }

    .stat-label {
      margin-top: 2px;
      color: var(--page-header-subtext);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .theme-toggle {
      position: relative;
      width: 62px;
      height: 31px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 999px;
      background: rgba(255, 255, 255, .15);
      transition: all .25s ease;
    }

    .theme-toggle.active {
      border-color: transparent;
      background: rgba(255, 255, 255, .88);
    }

    .theme-toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--shadow-sm);
      transition: transform .28s cubic-bezier(.34, 1.56, .64, 1);
    }

    .theme-toggle.active .theme-toggle-slider { transform: translateX(31px); }

    /* TOOLBAR */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-wrapper input {
      width: 100%;
      height: 45px;
      padding: 10px 16px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
      transition: all .2s ease;
    }

    .search-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 45px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      transition: all .2s ease;
    }

    .btn:hover {
      border-color: var(--primary);
      background: var(--card-bg-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary {
      color: #fff !important;
      border-color: transparent;
      background: var(--accent-gradient);
    }

    .btn-primary:hover { filter: brightness(1.05); }

    .view-buttons { display: flex; gap: 8px; }

    .view-buttons button {
      min-height: 45px;
      padding: 0 18px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      font-size: 13px;
      font-weight: 700;
    }

    .view-buttons button.active {
      color: #fff !important;
      border-color: transparent;
      background: var(--accent-gradient);
    }

    /* TABLE */
    .table-container {
      max-height: 74vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      box-shadow: var(--shadow-md);
    }

    table {
      width: 100%;
      min-width: 950px;
      border-spacing: 0;
      border-collapse: separate;
      background: var(--card-bg);
    }

    /* HEADER TABEL — BERWARNA SOFT */
    th {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 0;
      color: var(--table-header-text);
      background: var(--table-header-bg);
      border-bottom: 1px solid var(--table-header-border);
      font-size: 12px;
      font-weight: 850;
      text-align: left;
      white-space: nowrap;
    }

    th .th-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
    }

    .column-filter-btn {
      display: inline-grid;
      place-items: center;
      width: 27px;
      height: 27px;
      color: var(--table-header-text);
      border: 1px solid rgba(47, 79, 79, .22);
      border-radius: 7px;
      background: rgba(255, 255, 255, .55);
      font-size: 12px;
      transition: all .18s ease;
    }

    [data-theme="dark"] .column-filter-btn {
      color: var(--table-header-text);
      border-color: rgba(216, 236, 233, .22);
      background: rgba(255, 255, 255, .08);
    }

    .column-filter-btn:hover,
    .column-filter-btn.active {
      color: #ffffff;
      border-color: transparent;
      background: #4f6d7a;
    }

    [data-theme="dark"] .column-filter-btn:hover,
    [data-theme="dark"] .column-filter-btn.active {
      color: #101820;
      background: #8fb0bd;
    }

    .column-filter-btn.has-filter {
      color: #ffffff;
      border-color: transparent;
      background: #4f6d7a;
    }

    [data-theme="dark"] .column-filter-btn.has-filter {
      color: #101820;
      background: #8fb0bd;
    }

    td {
      padding: 12px 14px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 13px;
      vertical-align: middle;
      overflow-wrap: anywhere;
    }

    tbody tr:hover td { background: var(--card-bg-hover); }
    tbody tr:last-child td { border-bottom: none; }

    .material-code {
      color: var(--primary-dark);
      font-weight: 800;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-disc {
      color: var(--status-disc-text);
      border-color: var(--status-disc-border);
      background: var(--status-disc-bg);
    }

    .status-cont {
      color: var(--status-cont-text);
      border-color: var(--status-cont-border);
      background: var(--status-cont-bg);
    }

    .status-other {
      color: var(--status-other-text);
      border-color: var(--status-other-border);
      background: var(--status-other-bg);
    }

    /* FILTER KOLOM */
    .filter-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 8px;
      z-index: 1000;
      display: none;
      width: min(320px, calc(100vw - 40px));
      padding: 12px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      box-shadow: var(--shadow-lg);
    }

    .filter-popover.open { display: block; }

    .filter-search {
      width: 100%;
      height: 38px;
      margin-bottom: 10px;
      padding: 8px 12px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--card-bg-hover);
    }

    .filter-search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .filter-options {
      max-height: 230px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card-bg);
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 11px;
      color: var(--text);
      cursor: pointer;
      font-size: 12.5px;
      border-bottom: 1px solid var(--border);
    }

    .filter-option:last-child { border-bottom: none; }
    .filter-option:hover { background: var(--card-bg-hover); }
    .filter-option span { overflow-wrap: anywhere; }

    .filter-option input {
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--primary);
    }

    .filter-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .filter-actions button {
      flex: 1;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg-hover);
      color: var(--text);
      font-size: 12px;
      font-weight: 750;
    }

    .filter-actions .apply {
      color: #fff;
      border-color: transparent;
      background: var(--accent-gradient);
    }

    .empty-cell { padding: 0 !important; }

    .empty-state, .loading, .error-state {
      padding: 56px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-state strong, .error-state strong { color: var(--text); }
    .error-state { color: #b4595f; }

    .loading-spinner {
      display: inline-block;
      width: 26px;
      height: 26px;
      margin-bottom: 10px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* CARD VIEW */
    .card-mode {
      display: none;
      flex-wrap: wrap;
      gap: 14px;
    }

    .card-mode.active { display: flex; }

    .card {
      position: relative;
      flex: 1 1 300px;
      min-width: 280px;
      max-width: calc(33.333% - 10px);
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      box-shadow: var(--shadow-md);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .card::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      border-radius: 4px 0 0 4px;
      content: "";
    }

    .card.disc::before { background: #c98a93; }
    .card.cont::before { background: #7fa892; }
    .card.other::before { background: #c7ab74; }

    .card-code {
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .card-name {
      margin: 0 0 10px;
      font-size: 14.5px;
      font-weight: 800;
      word-break: break-word;
    }

    .card p { margin: 5px 0; color: var(--text-light); font-size: 12px; }
    .card p strong { color: var(--text); }

    .card-note {
      margin-top: 10px !important;
      padding-top: 9px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 1050px) {
      .card { max-width: calc(50% - 7px); }
    }

    @media (max-width: 760px) {
      body { padding: 14px; }

      .header-section,
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .header-right { justify-content: flex-start; }
      .btn, .view-buttons button { width: 100%; }
      .view-buttons { flex-direction: column; }
      .card { max-width: 100%; }
      .filter-popover { left: 4px; }
    }

    @media (max-width: 460px) {
      .stats-bar { width: 100%; }
      .stat-item { flex: 1; }
    }
  </style>
</head>

<body>
  <header class="header-section">
    <div class="header-title">
      <h1>Advance Digitals</h1>
      <p>Product and Status Dashboard</p>
    </div>

    <div class="header-right">
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-value" id="totalCount">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="continueCount">0</div>
          <div class="stat-label">Lanjut</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="discontinueCount">0</div>
          <div class="stat-label">Stop</div>
        </div>
      </div>

      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Ubah mode terang atau gelap">
        <span class="theme-toggle-slider" id="themeIcon">☀️</span>
      </button>
    </div>
  </header>

  <section class="toolbar">
    <div class="search-wrapper">
      <input
        id="search"
        type="search"
        placeholder="Cari kode, nama barang, pemasok, asal, status, atau catatan..."
        autocomplete="off"
      />
    </div>

    <div class="view-buttons">
      <button id="btnTable" class="active" type="button">Tabel</button>
      <button id="btnCard" type="button">Kartu</button>
    </div>

    <button class="btn btn-primary" id="btnExport" type="button">⬇️ Ekspor Excel</button>
  </section>

  <section id="tableView" class="table-container">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </section>

  <section id="cardView" class="card-mode"></section>

  <script>
    const CSV_PATHS = [
      "./data.csv",
      "data.csv",
      "./Data.csv",
      "Data.csv",
      "./DATA.csv",
      "./data/data.csv",
      "./assets/data.csv"
    ];

    const COLUMNS = [
      { key: "code", label: "Kode Material" },
      { key: "name", label: "Nama Barang" },
      { key: "supplier", label: "Pemasok" },
      { key: "origin", label: "Asal" },
      { key: "status", label: "Status" },
      { key: "note", label: "Catatan" }
    ];

    const allData = [];
    const columnValues = {};
    const columnSelections = {};
    const columnSearches = {};

    const dom = {};

    function initDomCache() {
      [
        "search", "btnExport", "tableHead", "tableBody",
        "tableView", "cardView", "btnTable", "btnCard",
        "totalCount", "continueCount", "discontinueCount",
        "themeToggle", "themeIcon"
      ].forEach(id => dom[id] = document.getElementById(id));
    }

    function escapeHtml(value) {
      const el = document.createElement("div");
      el.textContent = String(value ?? "");
      return el.innerHTML;
    }

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    function isDiscontinued(status) {
      const s = normalize(status);
      return s.includes("discontinue") ||
             s.includes("dihentikan") ||
             s.includes("stop") ||
             s.includes("berhenti");
    }

    function isContinuing(status) {
      const s = normalize(status);
      if (isDiscontinued(s)) return false;
      return s.includes("continue") ||
             s.includes("lanjut produksi") ||
             s.includes("lanjut");
    }

    function getStatusClass(status) {
      if (isDiscontinued(status)) return "disc";
      if (isContinuing(status)) return "cont";
      return "other";
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      const cleanText = text.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");

      for (let i = 0; i < cleanText.length; i++) {
        const char = cleanText[i];
        const nextChar = cleanText[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === "," && !inQuotes) {
          row.push(field.trim());
          field = "";
          continue;
        }

        if (char === "\n" && !inQuotes) {
          row.push(field.trim());
          if (row.some(value => value !== "")) rows.push(row);
          row = [];
          field = "";
          continue;
        }

        field += char;
      }

      row.push(field.trim());
      if (row.some(value => value !== "")) rows.push(row);

      return rows;
    }

    function loadDataFromCSV(text) {
      const rows = parseCSV(text);

      if (rows.length < 2) {
        showEmptyState("CSV hanya memiliki header atau tidak memiliki data.");
        return;
      }

      allData.length = 0;

      COLUMNS.forEach(column => {
        columnValues[column.key] = new Set();
        columnSelections[column.key] = new Set();
        columnSearches[column.key] = "";
      });

      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const record = {
          code: (r[0] || "").trim(),
          name: (r[1] || "").trim(),
          supplier: (r[2] || "").trim(),
          origin: (r[3] || "").trim(),
          status: (r[4] || "").trim(),
          note: (r[5] || "").trim()
        };

        if (!Object.values(record).some(value => value !== "")) continue;

        allData.push(record);

        COLUMNS.forEach(column => {
          const value = record[column.key];
          if (value !== "") columnValues[column.key].add(value);
        });
      }

      if (!allData.length) {
        showEmptyState("Data produk tidak ditemukan dalam CSV.");
        return;
      }

      renderTableHead();
      applyFilters();
    }

    function renderTableHead() {
      const fragment = document.createDocumentFragment();
      const tr = document.createElement("tr");

      COLUMNS.forEach(column => {
        const th = document.createElement("th");
